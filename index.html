<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>生没年グラフ</title>
<style>
:root{
  --bg:#f6f3ec;--panel:#fffdf8;--ink:#23211d;--sub:#7a746a;--line:#e2ddd2;
  --accent:#c8553d;--ev:#2f6db5;--era1:rgba(120,100,60,.07);--era2:rgba(120,100,60,.0);
  --namew:150px;--colw:36px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#1c1d20;--panel:#25262a;--ink:#ecebe7;--sub:#9a978f;--line:#393a3f;
    --accent:#ff7d5e;--ev:#6ea8ff;--era1:rgba(255,255,255,.05);--era2:rgba(255,255,255,0);}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:system-ui,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;font-size:14px}
header{padding:14px 16px 6px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h1{font-size:21px;margin:0;letter-spacing:.05em}
header .ver{color:var(--sub);font-size:12px}
.wrap{padding:0 16px 24px;max-width:1400px;margin:0 auto}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input[type=text],select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:6px 9px}
button{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:6px 12px}
.seg button.on{background:var(--accent);color:#fff}
label.ck{display:inline-flex;gap:4px;align-items:center;font-size:13px;color:var(--sub);cursor:pointer}
.searchbox{position:relative;flex:1 1 260px;max-width:420px}
.searchbox input{width:100%}
.dd{position:absolute;left:0;right:0;top:100%;margin-top:3px;background:var(--panel);border:1px solid var(--line);
  border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.15);z-index:30;max-height:360px;overflow:auto;display:none}
.dd .it{padding:7px 10px;cursor:pointer;border-bottom:1px solid var(--line)}
.dd .it:last-child{border-bottom:0}
.dd .it:hover,.dd .it.on{background:var(--bg)}
.dd .it b{font-weight:600}
.dd .it small{color:var(--sub);display:block;font-size:11.5px}
.dd .msg{padding:8px 10px;color:var(--sub)}
.lbl{color:var(--sub);font-size:12px}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.presets button{font-size:12.5px;padding:4px 9px;border-radius:999px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;max-height:180px;overflow:auto}
.chip{font-size:12px;padding:3px 8px;border-radius:999px;border:1px solid var(--line);cursor:pointer;background:var(--bg)}
.chip:hover{border-color:var(--accent)}
.chip.in{opacity:.35}
.chip .cx{margin-left:4px;color:var(--sub)}
details summary{cursor:pointer;color:var(--sub);font-size:12.5px}
textarea{width:100%;min-height:80px}
.title{width:100%;font-size:20px;font-weight:700;border:0;background:transparent;padding:4px 2px;margin:2px 0 4px}
.title:focus{outline:1px dashed var(--line);background:var(--panel)}
#info{min-height:20px;color:var(--sub);font-size:12.5px;margin:2px 2px 6px}
#info b{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:50}
.toast.on{opacity:.92}
.empty{padding:40px 10px;text-align:center;color:var(--sub);line-height:1.9}

/* ===== グラフ共通 ===== */
.chart{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px 12px;user-select:none;position:relative}
.era,.gridl,.ovl,.cline,.evl{position:absolute;pointer-events:none}
.ovl{background:rgba(200,85,61,.13)}
.cyear{position:absolute;background:var(--accent);color:#fff;font-size:11px;border-radius:5px;padding:1px 6px;display:none;z-index:6;white-space:nowrap;pointer-events:none}
.bar{position:absolute;overflow:hidden;cursor:pointer;font-size:11px;color:#fff;border-radius:5px}
.bar .lb{position:absolute;display:flex;align-items:center;gap:5px;padding:0 6px;white-space:nowrap;text-shadow:0 0 3px rgba(0,0,0,.35)}
.bar .lb b,.lbo b{font-weight:700}
.bar.period{border-radius:1px}
.bar.period::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.22) 0 5px,transparent 5px 10px);pointer-events:none}
.lbo{position:absolute;display:none;align-items:center;gap:5px;font-size:11px;color:var(--ink);white-space:nowrap;pointer-events:none}
.lbo span{color:var(--sub)}
.age{position:absolute;font-size:11px;background:var(--panel);border:1px solid var(--line);color:var(--ink);
  border-radius:4px;padding:0 4px;display:none;pointer-events:none;z-index:4;white-space:nowrap}
.sel .bar{outline:2.5px solid var(--ink);outline-offset:1px}
.dh{touch-action:none;cursor:grab}
.dh .grip{color:var(--sub);opacity:.5;font-size:11px;letter-spacing:-2px}
.dh .x{border:0;background:none;color:var(--sub);padding:0 3px;font-size:14px;visibility:hidden;cursor:pointer}
.dh:hover .x{visibility:visible}
.dh .tag{font-size:10px;color:var(--sub);border:1px solid var(--line);border-radius:3px;padding:0 3px}
.dragging{opacity:.45}
.seglb{position:absolute;overflow:hidden;white-space:nowrap;font-size:10.5px;color:var(--sub)}
.gseg{position:absolute;overflow:hidden;white-space:nowrap;font-size:10px;color:var(--sub);border-color:var(--line);border-style:solid;border-width:0}
.gseg.alt{background:var(--era1)}
.evlb{position:absolute;font-size:10.5px;color:var(--ev);white-space:nowrap;background:var(--panel);padding:0 3px;border-radius:3px;z-index:3}
.evl{border-color:var(--ev);border-style:dashed;border-width:0;opacity:.8}

/* ===== 横 ===== */
.H .axis{display:flex;position:sticky;top:0;background:var(--panel);z-index:5;padding-top:4px}
.H .namecol{width:var(--namew);flex:none}
.H .atrack{position:relative;flex:1;border-bottom:1px solid var(--line)}
.H .arow{position:relative}
.H .arow.era{height:15px}
.H .arow.gen{height:16px;border-top:1px solid var(--line)}
.H .arow.ev{height:16px}
.H .arow.tk{height:24px}
.H .arow.tk.g2{height:36px}
.H .seglb{top:0;height:15px;padding-left:3px}
.H .gseg{top:1px;height:14px;line-height:14px;padding-left:2px;border-left-width:1px}
.H .gseg.n{height:7px;line-height:7px;font-size:7px}
.H .gseg.s{top:8px;height:7px;line-height:7px;font-size:7px}
.H .tick{position:absolute;bottom:0;transform:translateX(-50%);font-size:11px;color:var(--sub);padding-bottom:3px;white-space:nowrap;text-align:center;line-height:1.15}
.H .tick small{display:block;font-size:9.5px}
.H .evlb{top:1px;transform:translateX(-50%)}
.H .cyear{bottom:3px;transform:translateX(-50%)}
.H .body{position:relative}
.H .bg{position:absolute;left:var(--namew);right:0;top:0;bottom:0;pointer-events:none}
.H .era,.H .gridl,.H .ovl,.H .cline,.H .evl{top:0;bottom:0}
.H .gridl{border-left:1px dashed var(--line)}
.H .ovl{border-left:1px solid var(--accent);border-right:1px solid var(--accent)}
.H .cline{border-left:1.5px solid var(--accent);display:none}
.H .evl{border-left-width:1.5px}
.H .row{display:flex;align-items:center;height:30px;position:relative}
.H .row.ins-b{box-shadow:inset 0 3px 0 var(--accent)}
.H .row.ins-a{box-shadow:inset 0 -3px 0 var(--accent)}
.H .name{width:var(--namew);flex:none;display:flex;align-items:center;gap:3px;padding-right:8px;overflow:hidden;height:100%}
.H .name span.nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.H .sel .name span.nm{font-weight:700}
.H .track{position:relative;flex:1;height:100%}
.H .bar{top:5px;height:20px}
.H .bar .lb{top:0;bottom:0}
.H .bar.fb{border-top-left-radius:0;border-bottom-left-radius:0}
.H .bar.fd,.H .bar.unknown,.H .bar.alive{border-top-right-radius:0;border-bottom-right-radius:0}
.H .bar.alive{box-shadow:inset -3px 0 0 rgba(255,255,255,.55)}
.H .lbo{top:5px;height:20px}
.H .age{top:6px;transform:translateX(4px)}

/* ===== 縦 ===== */
.V{padding:0;overflow:hidden}
.V .vscroll{overflow:auto;max-height:calc(100vh - 30px)}
.V .vgrid{display:grid;position:relative}
.V .corner{position:sticky;top:0;left:0;z-index:8;background:var(--panel);border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
.V .vhead{position:sticky;top:0;z-index:7;background:var(--panel);border-bottom:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:4px 0;gap:3px;overflow:hidden}
.V .vhead span.nm{writing-mode:vertical-rl;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-height:0}
.V .vhead .grip{writing-mode:horizontal-tb;letter-spacing:-2px}
.V .vhead.ins-b{box-shadow:inset 3px 0 0 var(--accent)}
.V .vhead.ins-a{box-shadow:inset -3px 0 0 var(--accent)}
.V .sel.vhead span.nm{font-weight:700}
.V .vaxis{position:sticky;left:0;z-index:6;background:var(--panel);border-right:1px solid var(--line)}
.V .seglb{left:0;width:18px;writing-mode:vertical-rl;padding-top:3px;line-height:18px}
.V .gseg{width:18px;writing-mode:vertical-rl;padding-top:2px;line-height:17px;border-top-width:1px}
.V .gseg.n{width:9px;line-height:9px;font-size:7px}
.V .gseg.s{width:9px;line-height:9px;font-size:7px}
.V .tick{position:absolute;right:4px;transform:translateY(-50%);font-size:11px;color:var(--sub);white-space:nowrap;text-align:right;line-height:1.1}
.V .tick small{display:block;font-size:9.5px}
.V .cyear{right:2px;transform:translateY(-50%)}
.V .vbody{position:relative}
.V .bg{position:absolute;inset:0;pointer-events:none}
.V .era,.V .gridl,.V .ovl,.V .cline,.V .evl{left:0;right:0}
.V .gridl{border-top:1px dashed var(--line)}
.V .ovl{border-top:1px solid var(--accent);border-bottom:1px solid var(--accent)}
.V .cline{border-top:1.5px solid var(--accent);display:none}
.V .evl{border-top-width:1.5px}
.V .evlb{left:2px;transform:translateY(-100%)}
.V .cols{position:absolute;inset:0;display:flex}
.V .col{position:relative;width:var(--colw);flex:none;height:100%}
.V .bar{left:6px;width:24px}
.V .bar .lb{left:0;right:0;writing-mode:vertical-rl;padding:6px 0;justify-content:flex-start;line-height:24px}
.V .bar.fb{border-top-left-radius:0;border-top-right-radius:0}
.V .bar.fd,.V .bar.unknown,.V .bar.alive{border-bottom-left-radius:0;border-bottom-right-radius:0}
.V .bar.alive{box-shadow:inset 0 -3px 0 rgba(255,255,255,.55)}
.V .lbo{left:6px;width:24px;writing-mode:vertical-rl;justify-content:flex-start;line-height:24px}
.V .age{left:2px;transform:translateY(-120%)}
@media (max-width:640px){:root{--namew:96px}}
</style>
</head>
<body>
<header><h1>生没年グラフ</h1><span class="ver">v0.4</span><span class="lbl" id="dataStat"></span></header>
<div class="wrap">

  <div class="panel">
    <div class="ctrl">
      <div class="searchbox">
        <input type="text" id="q" placeholder="名前を入れて追加（例：織田信長）" autocomplete="off">
        <div class="dd" id="dd"></div>
      </div>
      <select id="sort" title="並べ順">
        <option value="birth">生まれ順</option>
        <option value="death">没年順</option>
        <option value="life">享年順</option>
        <option value="added">自分で並べた順</option>
      </select>
      <select id="era" title="背景の時代区分">
        <option value="jp">背景：日本の時代</option>
        <option value="world">背景：世界の時代</option>
        <option value="none">背景：なし</option>
      </select>
      <span class="seg" id="orient"><button data-o="h" class="on">横</button><button data-o="v">縦</button></span>
      <select id="vscale" title="縦の長さ" style="display:none">
        <option value="0.5">長さ ×0.5</option><option value="1" selected>長さ ×1</option><option value="2">長さ ×2</option><option value="4">長さ ×4</option>
      </select>
    </div>
    <div class="ctrl" style="margin-top:8px">
      <label class="ck"><input type="checkbox" id="gtick"> 目盛りに元号</label>
      <label class="ck"><input type="checkbox" id="gband"> 元号の帯</label>
      <span style="flex:1"></span>
      <button id="saveJson">保存</button>
      <button id="loadJson">読み込み</button><input type="file" id="loadFile" accept=".json" style="display:none">
      <button id="share">共有URL</button>
      <button id="clear">全部消す</button>
    </div>
    <div class="presets" id="presets"></div>
    <details style="margin-top:8px" id="catBox">
      <summary>分野から選ぶ</summary>
      <div class="ctrl" style="margin-top:6px">
        <select id="cat"></select>
        <input type="text" id="catFilter" placeholder="しぼりこみ" style="flex:1 1 140px;max-width:220px">
        <button id="catTop">上位10人を追加</button>
      </div>
      <div class="chips" id="chips"></div>
    </details>
    <details style="margin-top:6px" id="manBox">
      <summary>自分で追加（期間・できごと）</summary>
      <div class="ctrl" style="margin-top:6px">
        <select id="mType"><option value="period">期間（帯で並べる）</option><option value="event">できごと（線を引く）</option></select>
        <input type="text" id="mName" placeholder="名前（例：応仁の乱）" style="flex:1 1 180px;max-width:260px">
        <input type="text" id="mS" placeholder="始まり（例：1467）" style="width:140px">
        <span id="mDash">〜</span>
        <input type="text" id="mE" placeholder="終わり（例：1477）" style="width:140px">
        <button id="mAdd">追加</button>
        <span class="lbl" id="mMsg">紀元前は「前221」</span>
      </div>
      <div class="chips" id="manList"></div>
    </details>
    <details style="margin-top:6px">
      <summary>まとめて追加（1行に1人）</summary>
      <textarea id="bulk" placeholder="夏目漱石&#10;森鷗外&#10;芥川龍之介" style="margin-top:6px"></textarea>
      <div class="ctrl" style="margin-top:6px">
        <button id="bulkGo">追加する</button>
        <label class="lbl">データファイル読込：<input type="file" id="dataFile" accept=".json"></label>
      </div>
    </details>
  </div>

  <input type="text" class="title" id="title" placeholder="題名（なくてもOK）">
  <div id="info"></div>
  <div class="chart H" id="chart"></div>
</div>
<div class="toast" id="toast"></div>

<script>
'use strict';
const CUR = new Date().getFullYear();
const WD_API = 'https://www.wikidata.org/w/api.php';
const WD_SPARQL = 'https://query.wikidata.org/sparql';
const DATA_URL = 'seibotsunen-data.json';

const BUILTIN_PRESETS = [
  {name:'戦国三英傑とまわり', names:['織田信長','豊臣秀吉','徳川家康','武田信玄','上杉謙信','伊達政宗','明智光秀','今川義元','毛利元就','石田三成','真田信繁','北条氏康']},
  {name:'幕末・明治維新', names:['坂本龍馬','西郷隆盛','大久保利通','木戸孝允','勝海舟','徳川慶喜','吉田松陰','高杉晋作','近藤勇','土方歳三','岩倉具視','伊藤博文']},
  {name:'お札の人', names:['聖徳太子','紫式部','岩倉具視','伊藤博文','夏目漱石','新渡戸稲造','福澤諭吉','樋口一葉','野口英世','渋沢栄一','津田梅子','北里柴三郎']},
  {name:'明治〜昭和の文豪', names:['夏目漱石','森鷗外','樋口一葉','与謝野晶子','志賀直哉','谷崎潤一郎','芥川龍之介','宮沢賢治','川端康成','太宰治','中島敦','三島由紀夫']},
  {name:'クラシック作曲家', names:['アントニオ・ヴィヴァルディ','ヨハン・ゼバスティアン・バッハ','ゲオルク・フリードリヒ・ヘンデル','フランツ・ヨーゼフ・ハイドン','ヴォルフガング・アマデウス・モーツァルト','ルートヴィヒ・ヴァン・ベートーヴェン','フランツ・シューベルト','フレデリック・ショパン','ロベルト・シューマン','フランツ・リスト','ヨハネス・ブラームス','ピョートル・チャイコフスキー','グスタフ・マーラー','クロード・ドビュッシー']},
  {name:'ルネサンスの巨匠', names:['ヤン・ファン・エイク','フィリッポ・ブルネレスキ','ドナテッロ','サンドロ・ボッティチェッリ','レオナルド・ダ・ヴィンチ','アルブレヒト・デューラー','ミケランジェロ・ブオナローティ','ラファエロ・サンティ','ティツィアーノ・ヴェチェッリオ','ピーテル・ブリューゲル']},
  {name:'科学の巨人', names:['ガリレオ・ガリレイ','ヨハネス・ケプラー','アイザック・ニュートン','マイケル・ファラデー','チャールズ・ダーウィン','トーマス・エジソン','ニコラ・テスラ','マリ・キュリー','野口英世','アルベルト・アインシュタイン','湯川秀樹','スティーヴン・ホーキング']},
  {name:'古代の思想家', names:['ピタゴラス','老子','孔子','釈迦','ソクラテス','墨子','プラトン','孟子','荘子','アリストテレス']},
  {name:'えっ同じ時代！？', names:['徳川家康','ウィリアム・シェイクスピア','ガリレオ・ガリレイ','伊能忠敬','ジョージ・ワシントン','葛飾北斎','ルートヴィヒ・ヴァン・ベートーヴェン','ナポレオン・ボナパルト','エイブラハム・リンカーン','チャールズ・ダーウィン','坂本龍馬']},
  {name:'歴代総理大臣', names:['伊藤博文','黒田清隆','山縣有朋','松方正義','大隈重信','桂太郎','西園寺公望','原敬','高橋是清','加藤高明','犬養毅','東條英機','吉田茂','岸信介','池田勇人','佐藤栄作','田中角栄','中曽根康弘','小泉純一郎','安倍晋三']},
];

const ERAS = {
  jp:[['弥生',-400,250],['古墳',250,592],['飛鳥',592,710],['奈良',710,794],['平安',794,1185],['鎌倉',1185,1336],
      ['室町',1336,1573],['安土桃山',1573,1603],['江戸',1603,1868],['明治',1868,1912],['大正',1912,1926],
      ['昭和',1926,1989],['平成',1989,2019],['令和',2019,9999]],
  world:[['古代',-9999,476],['中世',476,1453],['近世',1453,1789],['近代',1789,1914],['現代',1914,9999]],
  none:[]
};

/* ---------- 元号 ----------

const NB_FROM=1331, NB_TO=1392;      // 北朝・南朝が分かれてるあいだ
const GENGO = (()=>{
  const all=GENGO_RAW.map(([n,s,e,k])=>({n,s,e,k}));
  const north=all.filter(x=>x.k!=='S'), south=all.filter(x=>x.k==='S'||x.k==='B');
  const chain=list=>list.map((x,i)=>{ const nx=list[i+1]; return {...x, last: nx ? Math.min(x.e, nx.s) : x.e}; });
  return {north:chain(north), south:chain(south)};
})();
const gy=(x,Y)=>{ const k=Y-x.s+1; return x.n+(k===1?'元':k)+'年'; };
// その年の元号（改元の年は2つ）
function gengoAt(Y){
  if(Y<645) return null;
  const pick=ch=>ch.filter(x=>x.s<=Y && Y<=x.last);
  const n=pick(GENGO.north);
  if(Y>=NB_FROM && Y<=NB_TO){
    const s=pick(GENGO.south).filter(x=>Y<=NB_TO);
    const a=n.map(x=>gy(x,Y)).join('／'), b=s.map(x=>gy(x,Y)).join('／');
    if(!b || a===b) return a||null;
    return `北朝 ${a}・南朝 ${b}`;
  }
  return n.map(x=>gy(x,Y)).join('／') || null;
}
// 目盛り用（その年の終わりの元号ひとつ、北朝側）
function gengoTick(Y){
  if(Y<645) return '';
  const n=GENGO.north.filter(x=>x.s<=Y && Y<=x.last); if(!n.length) return '';
  const x=n[n.length-1]; const k=Y-x.s+1; return x.n+(k===1?'元':k);
}
// 帯用の区間 [s, e) と段（all / n / s）
function gengoSegs(min,max){
  const out=[];
  const push=(x,s,e,lane)=>{ s=Math.max(s,min); e=Math.min(e,max); if(e>s) out.push({n:x.n,s,e,lane}); };
  const segOf=(ch,i)=>{ const x=ch[i], nx=ch[i+1]; return [x.s, nx ? nx.s : Math.max(x.e+1, x.s+1)]; };
  GENGO.north.forEach((x,i)=>{ let [s,e]=segOf(GENGO.north,i);
    if(GENGO.north[i+1] && x.e+1 < GENGO.north[i+1].s) e=x.e+1;   // 元号のない時期（白雉〜朱鳥など）
    if(e<=NB_FROM || s>=NB_TO+1) push(x,s,e,'all');
    else { push(x,s,Math.min(e,NB_FROM),'all'); push(x,Math.max(s,NB_FROM),Math.min(e,NB_TO+1),'n'); push(x,Math.max(s,NB_TO+1),e,'all'); }
  });
  GENGO.south.forEach((x,i)=>{ const [s,e]=segOf(GENGO.south,i); push(x,Math.max(s,NB_FROM),Math.min(e,NB_TO+1),'s'); });
  return out;
}

/* ---------- 人物の詳しい取得（精度・頃・諸説・不明・活動時期） ---------- */
// 1人ぶんの形：{id,n,desc,links, b,b2,bc,bv, d,d2,dc,dv,du, f,f2}
//  b/d = 生年/没年（いちばん早い方）、b2/d2 = 幅があるときの遅い方
//  bc/dc = 「頃」、bv/dv = 表示用の説の一覧、du = 没年「不明」と登録、f/f2 = 活動時期
const WD_CIRCA='Q5727902';
const PFIELDS=['b','b2','bc','bv','d','d2','dc','dv','du','f','f2'];
function yearRange(y, prec){
  if(prec==null||prec>=9) return [y,y];
  if(prec===8){ const lo=Math.floor(y/10)*10; return [lo,lo+9]; }
  if(prec===7){ const c=Math.floor((y-1)/100); return [c*100+1,c*100+100]; }
  if(prec===6){ const m=Math.floor((y-1)/1000); return [m*1000+1,m*1000+1000]; }
  return [y,y];
}
function yearLabel(y, prec, circa){
  const Y=v=>v<=0?'前'+(1-v):String(v);
  if(prec===8 && y>0) return Math.floor(y/10)*10+'年代';
  if(prec===7){ const c=Math.floor((y-1)/100)+1; return (c<=0?'前'+(1-c):c)+'世紀'; }
  if(prec===6){ const m=Math.floor((y-1)/1000)+1; return (m<=0?'前'+(1-m):m)+'千年紀'; }
  if(prec!=null && prec<9) return Y(y)+'頃';
  return Y(y)+(circa?'頃':'');
}
function summarize(list){
  if(!list||!list.length) return null;
  const pref=list.filter(s=>s.rank==='p'); const use=pref.length?pref:list;
  const known=use.filter(s=>s.y!=null);
  if(!known.length) return {unknown:true};
  let lo=Infinity, hi=-Infinity, circa=false; const labels=[];
  for(const s of known){
    const [a,b]=yearRange(s.y,s.prec); lo=Math.min(lo,a); hi=Math.max(hi,b);
    if(s.circa || (s.prec!=null && s.prec<6)) circa=true;
    const L=yearLabel(s.y,s.prec,s.circa); if(!labels.includes(L)) labels.push(L);
  }
  const out={lo,hi,circa};
  if(labels.length>1 || circa || hi>lo) out.labels=labels;
  return out;
}
function peopleQuery(chunk){
  return `SELECT ?p ?sl ?jl ?el ?jd ?k ?s ?rank ?t ?prec ?circa WHERE {
  VALUES ?p { ${chunk.map(x=>'wd:'+x).join(' ')} }
  ?p wdt:P31 wd:Q5 .
  OPTIONAL { ?p wikibase:sitelinks ?sl }
  OPTIONAL { ?p rdfs:label ?jl FILTER(LANG(?jl)="ja") }
  OPTIONAL { ?p rdfs:label ?el FILTER(LANG(?el)="en") }
  OPTIONAL { ?p schema:description ?jd FILTER(LANG(?jd)="ja") }
  OPTIONAL {
    VALUES (?k ?pp ?psv) { ("b" p:P569 psv:P569) ("d" p:P570 psv:P570) ("f" p:P1317 psv:P1317) ("f" p:P2031 psv:P2031) ("f" p:P2032 psv:P2032) }
    ?p ?pp ?s . ?s wikibase:rank ?rank . FILTER(?rank != wikibase:DeprecatedRank)
    OPTIONAL { ?s ?psv ?v . ?v wikibase:timeValue ?t ; wikibase:timePrecision ?prec . }
    OPTIONAL { ?s pq:P1480 ?circa }
  }
}`;
}
function digestPeople(rows, out){
  for(const r of rows){
    const id=r.p.value.split('/').pop();
    const o=out[id]||(out[id]={id,n:null,desc:'',links:null,_en:null,_st:{b:new Map(),d:new Map(),f:new Map()}});
    if(r.jl) o.n=r.jl.value; if(r.el) o._en=r.el.value; if(r.jd) o.desc=r.jd.value;
    if(r.sl) o.links=+r.sl.value;
    if(r.k && r.s){
      const m=o._st[r.k.value]; let st=m.get(r.s.value);
      if(!st){ st={rank:/Preferred/.test(r.rank?r.rank.value:'')?'p':'n', y:null, prec:null, circa:false}; m.set(r.s.value,st); }
      if(r.t){ const y=parseYear(r.t.value); if(y!=null){ st.y=y; st.prec=r.prec?+r.prec.value:null; } }
      if(r.circa && r.circa.value.endsWith(WD_CIRCA)) st.circa=true;
    }
  }
}
function finishPerson(o){
  const B=summarize([...o._st.b.values()]), D=summarize([...o._st.d.values()]), F=summarize([...o._st.f.values()]);
  const p={id:o.id, n:o.n||o._en||o.id, desc:o.desc, links:o.links, b:null, d:null};
  if(B && !B.unknown){ p.b=B.lo; if(B.hi>B.lo) p.b2=B.hi; if(B.circa) p.bc=1; if(B.labels) p.bv=B.labels; }
  if(D && !D.unknown){ p.d=D.lo; if(D.hi>D.lo) p.d2=D.hi; if(D.circa) p.dc=1; if(D.labels) p.dv=D.labels; }
  if(D && D.unknown) p.du=1;
  if(F && !F.unknown){ p.f=F.lo; if(F.hi>F.lo) p.f2=F.hi; }
  return p;
}
// id の配列 → 人物情報（人間だけ）
async function fetchPeople(ids, size=80, prog){
  const out={};
  for(let i=0;i<ids.length;i+=size){
    if(prog) prog(i, ids.length);
    if(i) await sleep(250);
    digestPeople(await sparql(peopleQuery(ids.slice(i,i+size))), out);
  }
  const res={}; for(const id in out) res[id]=finishPerson(out[id]);
  return res;
}
function pickFields(p){ const o={id:p.id, n:p.n, desc:p.desc||''}; for(const k of PFIELDS) if(p[k]!=null) o[k]=p[k]; if(o.d===undefined) o.d=null; return o; }

const midB=p=>Math.round((p.b+(p.b2??p.b))/2);
const midD=p=>Math.round((p.d+(p.d2??p.d))/2);
const fuzzB=p=>p.b2!=null||!!p.bc;
const fuzzD=p=>p.d2!=null||!!p.dc;
function txtOf(v, mid, list){ if(list && list.length===1) return list[0]; if(list && list.length>1) return yearLabel(mid,9,true); return v<=0?'前'+(1-v):String(v); }
const birthTxt=p=>p.b==null?'':txtOf(p.b, midB(p), p.bv);
const deathTxt=p=>p.d==null?(p.du?'不明':''):txtOf(p.d, midD(p), p.dv);
function noteOf(p){
  const a=[];
  if(p.bv && p.bv.length>1) a.push('生年 諸説：'+p.bv.join('・'));
  if(p.dv && p.dv.length>1) a.push('没年 諸説：'+p.dv.join('・'));
  if(p.du) a.push('没年 不明');
  if(p.f!=null) a.push('活動時期：'+yearLabel(p.f,9)+(p.f2!=null?'〜'+yearLabel(p.f2,9):''));
  return a.join(' ／ ');
}

function remember(p){ PEOPLE[p.id]=p; if(!DATA || !DATA.people || !DATA.people[p.id]){ cache[p.id]=pickFields(p); lsSet(CACHE_KEY,cache); } }
async function searchHumans(q){
  const hits = await wdSearch(q);
  if(!hits.length) return [];
  const ppl = await fetchPeople(hits.map(h=>h.id).filter(id=>!PEOPLE[id]));
  const res = [];
  for(const h of hits){
    const p = PEOPLE[h.id] || ppl[h.id];
    if(p && p.b!=null && !isPeriod(p)){ if(!p.desc && h.description) p.desc=h.description; res.push(p); }
  }
  return res;
}
function localMatch(q, limit=6){
  q=q.trim(); if(!q) return [];
  const exact=[], part=[];
  for(const p of Object.values(PEOPLE)){
    if(p.b==null || isPeriod(p)) continue;
    if(p.n===q) exact.push(p); else if(p.n.includes(q)) part.push(p);
  }
  return exact.concat(part).slice(0,limit);
}
async function resolveName(name){
  name=name.trim(); if(!name) return null;
  const loc = localMatch(name,1); if(loc.length && loc[0].n===name) return loc[0];
  try{ const r = await searchHumans(name); if(r.length){ remember(r[0]); return r[0]; } }catch(e){}
  return loc[0] || null;
}
async function ensureIds(ids){
  const need = ids.filter(id=>/^Q\d+$/.test(id) && !PEOPLE[id]);
  if(need.length){ try{ const got = await fetchPeople(need); Object.values(got).forEach(remember); }catch(e){ toast('Wikidataにつながらない…'); } }
}

}
function removeId(id){
  list=list.filter(x=>x!==id); selected=selected.filter(x=>x!==id);
  if(/^M/.test(id)) delete PEOPLE[id];
  render(); syncURL();
}
const cleanTxt = s => String(s).replace(/[~|]/g,' ');
function syncURL(){
  const u = new URL(location.href);
  const setp=(k,v)=>{ if(v) u.searchParams.set(k,v); else u.searchParams.delete(k); };
  setp('ids', list.join(','));
  const man=[...list.filter(id=>/^M/.test(id)).map(id=>{const p=PEOPLE[id]; return `${id}~p~${cleanTxt(p.n)}~${p.b}~${p.d}`;}),
             ...events.map(e=>`${e.id}~e~${cleanTxt(e.n)}~${e.y}`)];
  setp('m', man.join('|'));
  setp('t', $('#title').value.trim());
  setp('sort', $('#sort').value==='added' ? 'added' : '');
  history.replaceState(null,'',u);
}
function readManualParam(v){
  for(const part of (v||'').split('|')){
    const [id,k,n,a,b]=part.split('~'); if(!id||!n) continue;
    const num=+id.slice(1); if(num>=manSeq) manSeq=num+1;
    if(k==='p' && /^M\d+$/.test(id)) PEOPLE[id]={id,n,type:'period',b:+a,d:+b};
    if(k==='e' && /^E\d+$/.test(id)) events.push({id,n,y:+a});
  }
}

/* ---------- 並べ順・形 ---------- */
function bZone(p){ let a=p.b, z=p.b2??p.b; if(p.bc && z-a<2){ a-=3; z+=3; } return [a,z]; }
function endOf(p){
  if(p.d!=null){ let a=p.d, z=p.d2??p.d; if(p.dc && z-a<2){ a-=3; z+=3; } return {kind:'dead', a, z, y:midD(p)}; }
  if(p.du || p.b < CUR-115){
    const base=Math.max((p.b2??p.b)+30, p.f2??-1e9, p.f??-1e9);
    const a=Math.min(base,CUR), z=Math.min(base+40,CUR); return {kind:'unknown', a, z, y:a};
  }
  return {kind:'alive', a:CUR, z:CUR, y:CUR};
}
function life(p){ const e=endOf(p); return e.kind==='dead' ? e.y - midB(p) : null; }
const lifeFuzzy=p=>fuzzB(p)||fuzzD(p);
function colorH(id){ if(!(id in colorIdx)) colorIdx[id]=nextColor++; return ((colorIdx[id]*137.508+15)%360).toFixed(1); }
function sorted(){
  const ps = list.map(id=>PEOPLE[id]).filter(Boolean);
  const m = $('#sort').value;
  if(m==='birth') ps.sort((a,b)=>midB(a)-midB(b));
  if(m==='death') ps.sort((a,b)=>endOf(a).y-endOf(b).y);
  if(m==='life') ps.sort((a,b)=>(life(b)??-1)-(life(a)??-1));
  return ps;
}
function niceStep(span, maxTicks){
  for(const s of [1,2,5,10,20,25,50,100,200,250,500,1000,2000]) if(span/s <= maxTicks) return s;
  return 5000;
}
// 1人ぶんの帯のかたち
function barOf(p){
  const e = endOf(p), [ba,bz] = bZone(p);
  const h = colorH(p.id), c = `hsl(${h} 52% 50%)`;
  const left = ba, right = Math.max(e.z, bz+0.5), w = right-left;
  const pc = v => ((v-left)/w*100).toFixed(2)+'%';
  const st = [];
  if(bz>ba) st.push(`hsl(${h} 52% 50% / .18) 0%`, `${c} ${pc(bz)}`); else st.push(`${c} 0%`);
  if(e.kind==='unknown' && e.z>e.a) st.push(`${c} ${pc(e.a)}`, `hsl(${h} 52% 50% / 0) 100%`);
  else if(e.z>e.a) st.push(`${c} ${pc(e.a)}`, `hsl(${h} 52% 50% / .18) 100%`);
  else st.push(`${c} 100%`);
  let txt;
  if(isPeriod(p)) txt = `${fmtY(p.b)}–${fmtY(p.d)}（${p.d-p.b}年間）`;
  else {
    const lf = life(p), fz = lifeFuzzy(p);
    const dt = e.kind==='dead' ? deathTxt(p) : e.kind==='alive' ? '存命' : (p.du?'不明':'?');
    txt = `${birthTxt(p)}–${dt}${lf!=null?`（${fz?'約':''}${lf}）`:''}`;
  }
  const cls = ['bar', e.kind, bz>ba?'fb':'', e.kind==='dead'&&e.z>e.a?'fd':'', isPeriod(p)?'period':''].join(' ');
  const lbAt = bz>ba && (e.a-bz) > w*0.35 ? pc(bz) : '0%';
  return {e, left, right, st, txt, cls, lbAt, note: isPeriod(p)?'自分で足した期間':noteOf(p),
    ageB: midB(p), ageF: isPeriod(p)?'p':(lifeFuzzy(p)?'1':'0'), ua: e.kind==='unknown'?e.a:''};
}

/* ---------- 描画 ---------- */
let geo = null; // {min,max,orient}
function render(){
  const chart = $('#chart');
  const V = SET.orient==='v';
  chart.className = 'chart '+(V?'V':'H');
  const ps = sorted();
  updateChips(); drawManList();
  if(!ps.length && !events.length){
    geo=null;
    chart.innerHTML = `<div class="empty">名前を入れるか、上のプリセットを押すと<br>生まれてから亡くなるまでの帯がズラッと並ぶ</div>`;
    $('#info').innerHTML=''; return;
  }
  const bars = ps.map(p=>({p, g:barOf(p)}));
  let min = Math.min(...bars.map(b=>b.g.left), ...events.map(e=>e.y));
  let max = Math.max(...bars.map(b=>b.g.right), ...events.map(e=>e.y));
  const span0 = Math.max(max-min, 10), pad = Math.max(2, Math.round(span0*0.03));
  min -= pad; max += pad;
  geo = {min,max,V};
  const P = y => ((y-min)/(max-min)*100).toFixed(3)+'%';
  const S = (a,b) => ((b-a)/(max-min)*100).toFixed(3)+'%';

  // 縦の長さ（px）
  const span = max-min;
  const VH = Math.round(Math.max(480, Math.min(span*7, 2600)) * SET.vscale);
  const step = niceStep(span, V ? Math.max(6, Math.round(VH/70)) : 9);
  const ticks=[]; for(let t=Math.ceil(min/step)*step; t<=max; t+=step) ticks.push(t);

  // 重なり
  let ovlR=null, info='';
  if(selected.length===2){
    const [A,B] = selected.map(id=>PEOPLE[id]);
    if(A && B){
      const s=Math.max(midB(A),midB(B)), e=Math.min(endOf(A).y,endOf(B).y);
      const ka=[A,B].some(p=>lifeFuzzy(p)||endOf(p).kind==='unknown')?'頃':'';
      const word=[A,B].some(isPeriod)?'重なってた期間':'同時に生きてた期間';
      if(e>s){ ovlR=[s,e]; info=`<b>${esc(A.n)}</b> と <b>${esc(B.n)}</b> が${word}：${fmtY(s)}${ka}〜${fmtY(e)}${ka}（約${e-s}年）`; }
      else info=`<b>${esc(A.n)}</b> と <b>${esc(B.n)}</b> は重なってない（すき間 約${s-e}年）`;
    }
  } else info = ps.length>=2 ? '帯をクリックで2つ選ぶと重なってた期間が出る ／ グラフの上をなぞると、その年に何歳か出る ／ 名前をつまむと並べ替え' : '';
  $('#info').innerHTML = info;

  const eraList = ERAS[$('#era').value].map(([nm,a,b])=>[nm,Math.max(a,min),Math.min(b,max)]).filter(x=>x[2]>x[1]);
  const gsegs = SET.gband ? gengoSegs(min,max) : [];
  const showGT = SET.gtick && max>=645;

  const pos = V ? (y=>`top:${P(y)}`) : (y=>`left:${P(y)}`);
  const box = V ? ((a,b)=>`top:${P(a)};height:${S(a,b)}`) : ((a,b)=>`left:${P(a)};width:${S(a,b)}`);

  // 背景
  let bg='';
  eraList.forEach(([nm,a,b],k)=>{ bg += `<div class="era" style="${box(a,b)};background:${k%2?'var(--era2)':'var(--era1)'}"></div>`; });
  ticks.forEach(t=>{ bg += `<div class="gridl" style="${pos(t)}"></div>`; });
  if(ovlR) bg += `<div class="ovl" style="${box(ovlR[0],ovlR[1])}"></div>`;
  events.forEach(ev=>{ bg += `<div class="evl" style="${pos(ev.y)}"></div>`; });
  bg += `<div class="cline" id="cline"></div>`;

  // 軸の中身
  const eraLbl = eraList.map(([nm,a,b])=>`<div class="seglb" style="${box(a,b)}">${esc(nm)}</div>`).join('');
  let gk=0;
  const genLbl = gsegs.map(g=>`<div class="gseg ${g.lane==='all'?'':g.lane} ${(gk++)%2?'alt':''}" style="${box(g.s,g.e)}" title="${esc(g.n)}">${esc(g.n)}</div>`).join('');
  const tickLbl = ticks.map(t=>{ const gt=showGT?gengoTick(t):''; return `<div class="tick" style="${pos(t)}">${fmtY(t)}${gt?`<small>${esc(gt)}</small>`:''}</div>`; }).join('');
  const evLbl = events.map(ev=>`<div class="evlb" style="${pos(ev.y)}" title="${esc(fmtY(ev.y)+'年 '+ev.n)}">${esc(fmtY(ev.y))} ${esc(ev.n)}</div>`).join('');

  const handle = p => `<span class="grip">⋮⋮</span><button class="x" title="消す" data-rm="${p.id}">×</button>`;
  const barHTML = (p,g) => `<div class="${g.cls}" data-sel="${p.id}" style="${box(g.left,g.right)};background:linear-gradient(${V?'180deg':'90deg'}, ${g.st.join(', ')})" title="${esc(p.n)} ${esc(g.txt)}${g.note?'&#10;'+esc(g.note):''}"><span class="lb" style="${V?'top':'left'}:${g.lbAt}"><b>${esc(p.n)}</b>${esc(g.txt)}</span></div>
      <span class="lbo"><b>${esc(p.n)}</b><span>${esc(g.txt)}</span></span>
      <span class="age" data-b="${g.ageB}" data-s="${g.left}" data-e="${g.right}" data-f="${g.ageF}" data-ua="${g.ua}"></span>`;

  if(!V){
    const rows = bars.map(({p,g})=>`<div class="row${selected.includes(p.id)?' sel':''}" data-id="${p.id}">
      <div class="name dh" data-id="${p.id}">${handle(p)}<span class="nm" title="${esc(p.n)}${p.desc?' — '+esc(p.desc):''}">${esc(p.n)}</span>${isPeriod(p)?'<span class="tag">期間</span>':''}</div>
      <div class="track">${barHTML(p,g)}</div></div>`).join('');
    chart.innerHTML = `
      <div class="axis"><div class="namecol"></div><div class="atrack" id="atrack">
        <div class="arow era">${eraLbl}</div>
        ${gsegs.length?`<div class="arow gen">${genLbl}</div>`:''}
        ${events.length?`<div class="arow ev">${evLbl}</div>`:''}
        <div class="arow tk${showGT?' g2':''}" id="tkrow">${tickLbl}<div class="cyear" id="cyear"></div></div>
      </div></div>
      <div class="body" id="cbody"><div class="bg">${bg}</div>${rows}</div>`;
  } else {
    const AX = 18 + (gsegs.length?20:0) + (showGT?70:46);
    const HEAD = 118;
    const gx = 18;            // 元号の帯の左
    const genV = gsegs.map(g=>{ const off = g.lane==='s'?9:0; return `<div class="gseg ${g.lane==='all'?'':g.lane} ${(gk++)%2?'alt':''}" style="left:${gx+off}px;${box(g.s,g.e)}" title="${esc(g.n)}">${esc(g.n)}</div>`; }).join('');
    const heads = bars.map(({p})=>`<div class="vhead dh${selected.includes(p.id)?' sel':''}" data-id="${p.id}" title="${esc(p.n)}${p.desc?' — '+esc(p.desc):''}">${handle(p)}<span class="nm">${esc(p.n)}</span>${isPeriod(p)?'<span class="tag">期</span>':''}</div>`).join('');
    const cols = bars.map(({p,g})=>`<div class="col${selected.includes(p.id)?' sel':''}" data-id="${p.id}">${barHTML(p,g)}</div>`).join('');
    const n = Math.max(bars.length,1);
    chart.innerHTML = `<div class="vscroll"><div class="vgrid" style="grid-template-columns:${AX}px repeat(${n}, var(--colw)) minmax(40px,1fr);grid-template-rows:${HEAD}px ${VH}px">
      <div class="corner" style="grid-column:1;grid-row:1"></div>
      ${heads}
      <div class="vaxis" style="grid-column:1;grid-row:2;position:sticky">
        <div style="position:absolute;inset:0">${eraLbl}${genV}${tickLbl}<div class="cyear" id="cyear"></div></div>
      </div>
      <div class="vbody" id="vbody" style="grid-column:2 / -1;grid-row:2"><div class="bg">${bg}${evLbl}</div><div class="cols">${cols}</div></div>
    </div></div>`;
    // 見出しを1列ずつ並べる
    chart.querySelectorAll('.vhead').forEach((h,i)=>{ h.style.gridColumn=String(i+2); h.style.gridRow='1'; });
  }
  fitLabels(); fitSegs();
}

// 帯に入りきらない名前は外へ（横：右→左、縦：下→上）
function fitLabels(){
  const V = SET.orient==='v';
  document.querySelectorAll(V?'#chart .col':'#chart .row').forEach(row=>{
    const bar=row.querySelector('.bar'), lb=bar&&bar.querySelector('.lb'), lbo=row.querySelector('.lbo');
    const tr = V ? row : row.querySelector('.track');
    if(!bar||!lb||!lbo) return;
    lb.style.visibility=''; lbo.style.display='none';
    const fits = V ? (lb.offsetTop + lb.scrollHeight <= bar.clientHeight + 1) : (lb.offsetLeft + lb.scrollWidth <= bar.clientWidth + 1);
    if(fits) return;
    lbo.style.display='flex';
    if(!V){
      const w=lbo.offsetWidth, R=bar.offsetLeft+bar.offsetWidth+5;
      if(R + w <= tr.clientWidth) lbo.style.left=R+'px';
      else if(bar.offsetLeft - w - 5 >= 0) lbo.style.left=(bar.offsetLeft - w - 5)+'px';
      else { lbo.style.display='none'; return; }
    } else {
      const h=lbo.offsetHeight, B=bar.offsetTop+bar.offsetHeight+5;
      if(B + h <= tr.clientHeight) lbo.style.top=B+'px';
      else if(bar.offsetTop - h - 5 >= 0) lbo.style.top=(bar.offsetTop - h - 5)+'px';
      else { lbo.style.display='none'; return; }
    }
    lb.style.visibility='hidden';
  });
}
// 時代・元号の名前、入らないものは隠す
function fitSegs(){
  const V = SET.orient==='v';
  document.querySelectorAll('#chart .seglb, #chart .gseg').forEach(el=>{
    el.style.color='';
    const over = V ? el.scrollHeight > el.clientHeight+1 : el.scrollWidth > el.clientWidth+1;
    if(over) el.style.color='transparent';
  });
}
window.addEventListener('resize', ()=>{ clearTimeout(fitLabels._t); fitLabels._t=setTimeout(()=>{ fitLabels(); fitSegs(); },120); });

/* ---------- なぞると年齢＋元号 ---------- */
function yearLabel2(y){ const g=gengoAt(y); return (y<=0?'紀元前'+(1-y):y)+'年'+(g?`（${g}）`:''); }
function onMove(ev){
  if(!geo || drag) return;
  const V = geo.V;
  const base = V ? $('#vbody') : $('#tkrow'); if(!base) return;
  const r = base.getBoundingClientRect();
  const f = V ? (ev.clientY - r.top)/r.height : (ev.clientX - r.left)/r.width;
  const cl=$('#cline'), cy=$('#cyear');
  if(f<0||f>1){ hideCursor(); return; }
  const y = Math.round(geo.min + f*(geo.max-geo.min));
  const p = ((y-geo.min)/(geo.max-geo.min)*100)+'%';
  cl.style.display='block'; cy.style.display='block'; cy.textContent = yearLabel2(y);
  if(V){ cl.style.top=p; cy.style.top=p; } else { cl.style.left=p; cy.style.left=p;
    // 札がはみ出さないように
    const w=cy.offsetWidth, x=f*r.width; cy.style.transform = `translateX(${x-w/2<0?-x: x+w/2>r.width? -(w-(r.width-x)) : -w/2}px)`; }
  document.querySelectorAll('#chart .age').forEach(a=>{
    const b=+a.dataset.b, s0=+a.dataset.s, e=+a.dataset.e;
    if(a.dataset.f==='p' || !(y>=s0 && y<=e && y>=b)){ a.style.display='none'; return; }
    const fz=a.dataset.f==='1' || (a.dataset.ua!=='' && y>+a.dataset.ua);
    a.style.display='block'; if(V) a.style.top=p; else a.style.left=p; a.textContent=(fz?'約':'')+(y-b)+'歳';
  });
}
function hideCursor(){ const cl=$('#cline'), cy=$('#cyear'); if(cl) cl.style.display='none'; if(cy) cy.style.display='none'; document.querySelectorAll('#chart .age').forEach(a=>a.style.display='none'); }
$('#chart').addEventListener('pointermove', onMove);
$('#chart').addEventListener('pointerleave', hideCursor);

/* ---------- 名前をつまんで並べ替え ---------- */
let drag=null, justDragged=false;
$('#chart').addEventListener('pointerdown', ev=>{
  const h=ev.target.closest('.dh'); if(!h || ev.target.closest('.x')) return;
  drag={id:h.dataset.id, x0:ev.clientX, y0:ev.clientY, on:false, target:null, after:false, pid:ev.pointerId, h};
});
document.addEventListener('pointermove', ev=>{
  if(!drag) return;
  const V = SET.orient==='v';
  if(!drag.on){
    if(Math.hypot(ev.clientX-drag.x0, ev.clientY-drag.y0) < 6) return;
    drag.on=true; hideCursor();
    try{ drag.h.setPointerCapture(drag.pid); }catch(e){}
    document.querySelectorAll(`#chart [data-id="${CSS.escape(drag.id)}"]`).forEach(el=>el.classList.add('dragging'));
  }
  ev.preventDefault();
  const hs=[...document.querySelectorAll('#chart .dh')];
  const markEls = V ? hs : hs.map(h=>h.closest('.row'));
  markEls.forEach(el=>el.classList.remove('ins-b','ins-a'));
  let tgt=null, after=false;
  for(let i=0;i<hs.length;i++){
    const r=hs[i].getBoundingClientRect(); const mid = V ? r.left+r.width/2 : r.top+r.height/2; const v = V ? ev.clientX : ev.clientY;
    if(v < mid){ tgt=i; after=false; break; }
    tgt=i; after=true;
  }
  if(tgt!=null){ markEls[tgt].classList.add(after?'ins-a':'ins-b'); drag.target=hs[tgt].dataset.id; drag.after=after; }
});
function endDrag(){
  if(!drag) return;
  const d=drag; drag=null;
  if(!d.on) return;
  justDragged=true; setTimeout(()=>justDragged=false,50);
  if(d.target && d.target!==d.id){
    if($('#sort').value!=='added'){ list=sorted().map(p=>p.id); $('#sort').value='added'; }
    list=list.filter(x=>x!==d.id);
    let i=list.indexOf(d.target); if(d.after) i++;
    list.splice(i,0,d.id);
  }
  render(); syncURL();
}
document.addEventListener('pointerup', endDrag);
document.addEventListener('pointercancel', endDrag);

$('#chart').addEventListener('click', ev=>{
  if(justDragged) return;
  const rm = ev.target.closest('[data-rm]'); if(rm){ removeId(rm.dataset.rm); return; }
  const s = ev.target.closest('[data-sel]') || ev.target.closest('.dh');
  if(s){
    const id = s.dataset.sel || s.dataset.id;
    if(selected.includes(id)) selected=selected.filter(x=>x!==id);
    else { selected.push(id); if(selected.length>2) selected.shift(); }
    render();
  }
});

/* ---------- 検索 ---------- */
const q=$('#q'), dd=$('#dd'); let ddItems=[], ddOn=0, searchSeq=0;
function showDD(items, msg){
  ddItems=items; ddOn=0;
  if(!items.length && !msg){ dd.style.display='none'; return; }
  dd.innerHTML = items.map((p,i)=>`<div class="it${i===0?' on':''}" data-i="${i}"><b>${esc(p.n)}</b>　${esc(birthTxt(p))}–${p.d!=null?esc(deathTxt(p)):(p.du||p.b<CUR-115?'?':'存命')}<small>${esc(p.desc||'')}</small></div>`).join('')
    + (msg?`<div class="msg">${esc(msg)}</div>`:'');
  dd.style.display='block';
}
q.addEventListener('input', ()=>{
  const v=q.value.trim(); const seq=++searchSeq;
  if(!v){ showDD([]); return; }
  const loc = localMatch(v);
  showDD(loc, 'Wikidataで探してる…');
  clearTimeout(q._t);
  q._t = setTimeout(async ()=>{
    try{
      const live = await searchHumans(v);
      if(seq!==searchSeq) return;
      const seen=new Set(loc.map(p=>p.id));
      const merged = loc.concat(live.filter(p=>!seen.has(p.id))).slice(0,10);
      showDD(merged, merged.length?'':'見つからない…');
    }catch(e){ if(seq===searchSeq) showDD(loc, 'Wikidataにつながらない（手元のデータだけ表示）'); }
  }, 350);
});
q.addEventListener('keydown', ev=>{
  if(dd.style.display!=='block') return;
  const its=dd.querySelectorAll('.it');
  if(ev.key==='ArrowDown'||ev.key==='ArrowUp'){ ev.preventDefault(); if(!its.length) return;
    ddOn=(ddOn+(ev.key==='ArrowDown'?1:-1)+its.length)%its.length; its.forEach((x,i)=>x.classList.toggle('on',i===ddOn)); }
  if(ev.key==='Enter'){ ev.preventDefault(); if(ddItems[ddOn]) pick(ddItems[ddOn]); }
  if(ev.key==='Escape') showDD([]);
});
dd.addEventListener('mousedown', ev=>{ const it=ev.target.closest('.it'); if(it){ ev.preventDefault(); pick(ddItems[+it.dataset.i]); } });
q.addEventListener('blur', ()=>setTimeout(()=>showDD([]),150));
function pick(p){ remember(p); add(p); q.value=''; showDD([]); searchSeq++; }

/* ---------- 名前をまとめて探す（4人ずつ同時、途中で止められる） ---------- */
let runId=0;
async function resolveMany(names, my, onFound){
  const miss=[]; let next=0, done=0;
  async function worker(){
    while(next<names.length){
      const i=next++; const p=await resolveName(names[i]);
      if(my!==runId) return;
      done++; toast(`さがし中… ${done}/${names.length}`);
      if(p) onFound(p); else miss.push(names[i]);
    }
  }
  await Promise.all(Array.from({length:Math.min(4,names.length)}, worker));
  return {miss, stopped: my!==runId};
}

/* ---------- プリセット ---------- */
function presetList(){ return (DATA && DATA.presets && DATA.presets.length) ? DATA.presets : BUILTIN_PRESETS; }
function drawPresets(){
  $('#presets').innerHTML = '<span class="lbl" style="align-self:center">プリセット：</span>' +
    presetList().map((p,i)=>`<button data-pi="${i}">${esc(p.name)}</button>`).join('');
}
$('#presets').addEventListener('click', async ev=>{
  const b=ev.target.closest('[data-pi]'); if(!b) return;
  const pr = presetList()[+b.dataset.pi];
  const my = ++runId;
  list=[]; selected=[]; colorIdx={}; nextColor=0;
  if($('#sort').value==='added') $('#sort').value='birth';
  if(pr.ids){ await ensureIds(pr.ids); if(my!==runId) return; pr.ids.forEach(id=>add(PEOPLE[id],true)); render(); syncURL(); return; }
  render();
  const r = await resolveMany(pr.names, my, p=>{ add(p,true); render(); });
  if(r.stopped) return;
  syncURL(); toast(r.miss.length ? '見つからない：'+r.miss.join('、') : 'できた！');
});

/* ---------- 分野 ---------- */
function drawCats(){
  const cats = (DATA && DATA.categories) || [];
  $('#catBox').style.display = cats.length ? '' : 'none';
  $('#cat').innerHTML = cats.map((c,i)=>`<option value="${i}">${esc(c.name)}（${c.ids.filter(id=>PEOPLE[id]&&PEOPLE[id].b!=null).length}人）</option>`).join('');
  updateChips();
}
function updateChips(){
  const cats = (DATA && DATA.categories) || []; if(!cats.length) return;
  const c = cats[+$('#cat').value||0]; if(!c) return;
  const f = $('#catFilter').value.trim();
  $('#chips').innerHTML = c.ids.map(id=>PEOPLE[id]).filter(p=>p && p.b!=null && (!f || p.n.includes(f)))
    .map(p=>`<span class="chip${list.includes(p.id)?' in':''}" data-cid="${p.id}" title="${esc(p.desc||'')}">${esc(p.n)} <small>${esc(birthTxt(p))}</small></span>`).join('');
}
$('#cat').addEventListener('change', updateChips);
$('#catFilter').addEventListener('input', updateChips);
$('#chips').addEventListener('click', ev=>{ const c=ev.target.closest('[data-cid]'); if(!c) return;
  const id=c.dataset.cid; if(list.includes(id)) removeId(id); else add(PEOPLE[id]); });
$('#catTop').addEventListener('click', ()=>{
  const c = DATA.categories[+$('#cat').value||0]; let n=0;
  for(const id of c.ids){ if(n>=10) break; if(!list.includes(id) && PEOPLE[id] && PEOPLE[id].b!=null){ add(PEOPLE[id],true); n++; } }
  render(); syncURL();
});

/* ---------- 自分で追加（期間・できごと） ---------- */
function syncManForm(){ const ev=$('#mType').value==='event'; $('#mE').style.display=ev?'none':''; $('#mDash').style.display=ev?'none':'';
  $('#mS').placeholder = ev ? '年（例：1805）' : '始まり（例：1467）'; $('#mName').placeholder = ev ? '名前（例：アウステルリッツ三帝会戦）' : '名前（例：応仁の乱）'; }
$('#mType').addEventListener('change', syncManForm);
function manMsg(t,ng){ const m=$('#mMsg'); m.textContent=t; m.style.color=ng?'var(--accent)':''; }
$('#mAdd').addEventListener('click', ()=>{
  const name=$('#mName').value.trim(); const ev=$('#mType').value==='event';
  const a=inYear($('#mS').value), b=ev?null:inYear($('#mE').value);
  if(!name) return manMsg('名前を入れてネ',true);
  if(a==null||Number.isNaN(a)) return manMsg('年の書き方がヘン（例：1467、前221）',true);
  if(!ev && (b==null||Number.isNaN(b))) return manMsg('終わりの年を入れてネ',true);
  if(!ev && b<a) return manMsg('終わりが始まりより前になってる',true);
  if(ev){ events.push({id:'E'+(manSeq++), n:name, y:a}); events.sort((x,y)=>x.y-y.y); }
  else { const id='M'+(manSeq++); PEOPLE[id]={id, n:name, type:'period', b:a, d:b}; list.push(id); }
  $('#mName').value=''; $('#mS').value=''; $('#mE').value=''; manMsg('追加した！');
  render(); syncURL();
});
function drawManList(){
  const items=[...list.filter(id=>/^M/.test(id)).map(id=>PEOPLE[id]).filter(Boolean).map(p=>({id:p.id,t:`▭ ${p.n} ${fmtY(p.b)}–${fmtY(p.d)}`})),
               ...events.map(e=>({id:e.id,t:`┃ ${e.n} ${fmtY(e.y)}`}))];
  $('#manList').innerHTML = items.map(x=>`<span class="chip" data-mid="${x.id}">${esc(x.t)}<span class="cx">×</span></span>`).join('');
}
$('#manList').addEventListener('click', ev=>{
  const c=ev.target.closest('[data-mid]'); if(!c) return; const id=c.dataset.mid;
  if(/^E/.test(id)){ events=events.filter(e=>e.id!==id); render(); syncURL(); }
  else removeId(id);
});

/* ---------- まとめて ---------- */
$('#bulkGo').addEventListener('click', async ()=>{
  const names = $('#bulk').value.split(/\n|、|,/).map(s=>s.trim()).filter(Boolean);
  const my = ++runId;
  const r = await resolveMany(names, my, p=>{ add(p,true); render(); });
  if(r.stopped) return;
  syncURL(); toast(r.miss.length ? '見つからない：'+r.miss.join('、') : 'できた！');
  if(!r.miss.length) $('#bulk').value='';
});

/* ---------- 表示の切り替え ---------- */
function applySet(){
  document.querySelectorAll('#orient button').forEach(b=>b.classList.toggle('on', b.dataset.o===SET.orient));
  $('#vscale').style.display = SET.orient==='v' ? '' : 'none';
  $('#vscale').value = String(SET.vscale);
  $('#gtick').checked = SET.gtick; $('#gband').checked = SET.gband;
  lsSet(SET_KEY, SET);
}
$('#orient').addEventListener('click', ev=>{ const b=ev.target.closest('[data-o]'); if(!b) return; SET.orient=b.dataset.o; applySet(); render(); });
$('#vscale').addEventListener('change', ()=>{ SET.vscale=+$('#vscale').value; applySet(); render(); });
$('#gtick').addEventListener('change', ()=>{ SET.gtick=$('#gtick').checked; applySet(); render(); });
$('#gband').addEventListener('change', ()=>{ SET.gband=$('#gband').checked; applySet(); render(); });
$('#sort').addEventListener('change', ()=>{ render(); syncURL(); });
$('#era').addEventListener('change', render);
$('#title').addEventListener('input', ()=>{ clearTimeout($('#title')._t); $('#title')._t=setTimeout(syncURL,300); });
$('#clear').addEventListener('click', ()=>{ runId++; list.filter(id=>/^M/.test(id)).forEach(id=>delete PEOPLE[id]);
  list=[]; events=[]; selected=[]; colorIdx={}; nextColor=0; render(); syncURL(); });
$('#share').addEventListener('click', async ()=>{
  syncURL();
  try{ await navigator.clipboard.writeText(location.href); toast('URLコピーした！'); }catch(e){ prompt('このURLを共有',location.href); }
});

/* ---------- 表示の保存・読み込み ---------- */
function snapshot(){
  const item = id => { const p=PEOPLE[id]; if(!p) return null; const o=pickFields(p); if(p.type) o.type=p.type; return o; };
  return {app:'seibotsunen-graph', version:1, saved:new Date().toISOString(),
    title:$('#title').value.trim(), order:list.slice(), items:list.map(item).filter(Boolean), events:events.map(e=>({...e})),
    selected:selected.slice(), settings:{...SET, sort:$('#sort').value, era:$('#era').value}};
}
$('#saveJson').addEventListener('click', ()=>{
  const d=snapshot();
  if(!d.items.length && !d.events.length){ toast('まだ何も並んでない…'); return; }
  const t=new Date(), ymd=`${t.getFullYear()}${String(t.getMonth()+1).padStart(2,'0')}${String(t.getDate()).padStart(2,'0')}`;
  const name=((d.title||'生没年グラフ').replace(/[\\/:*?"<>|]/g,'_'))+'_'+ymd+'.json';
  const blob=new Blob([JSON.stringify(d,null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
});
$('#loadJson').addEventListener('click', ()=>$('#loadFile').click());
$('#loadFile').addEventListener('change', async ev=>{
  const f=ev.target.files[0]; ev.target.value=''; if(!f) return;
  try{
    const d=JSON.parse(await f.text());
    if(d.app!=='seibotsunen-graph') throw 0;
    runId++;
    list.filter(id=>/^M/.test(id)).forEach(id=>delete PEOPLE[id]);
    for(const it of d.items||[]){ if(!it || !it.id) continue; PEOPLE[it.id]={...it}; const m=/^[ME](\d+)$/.exec(it.id); if(m && +m[1]>=manSeq) manSeq=+m[1]+1; }
    events=(d.events||[]).map(e=>({...e})); events.forEach(e=>{ const m=/^E(\d+)$/.exec(e.id); if(m && +m[1]>=manSeq) manSeq=+m[1]+1; });
    list=(d.order||[]).filter(id=>PEOPLE[id]); selected=(d.selected||[]).filter(id=>list.includes(id));
    colorIdx={}; nextColor=0;
    const s=d.settings||{};
    Object.assign(SET, {orient:s.orient||'h', gtick:!!s.gtick, gband:!!s.gband, vscale:s.vscale||1});
    if(s.sort) $('#sort').value=s.sort; if(s.era) $('#era').value=s.era;
    $('#title').value=d.title||'';
    applySet(); render(); syncURL(); toast('読み込んだ！');
  }catch(e){ toast('このファイルは読めない…（保存ボタンで作ったファイルを選んでネ）'); }
});

/* ---------- データ読込 ---------- */
function useData(d){
  DATA = d;
  for(const [id,p] of Object.entries(d.people||{})) PEOPLE[id] = {...pickFields({id,...p}), links:p.l??null};
  const n = Object.keys(d.people||{}).length;
  $('#dataStat').textContent = `手元データ ${n}人`;
  drawPresets(); drawCats(); render();
}
$('#dataFile').addEventListener('change', async ev=>{
  const f=ev.target.files[0]; if(!f) return;
  try{ useData(JSON.parse(await f.text())); toast('データ読み込んだ！'); }catch(e){ toast('読めないファイル…'); }
});

(async function init(){
  applySet(); syncManForm(); drawPresets(); drawCats();
  try{ const r = await fetch(DATA_URL,{cache:'no-cache'}); if(r.ok) useData(await r.json()); }catch(e){}
  if(!DATA) $('#dataStat').textContent = '手元データなし（Wikidataから直接さがす）';
  const sp = new URL(location.href).searchParams;
  readManualParam(sp.get('m'));
  if(sp.get('t')) $('#title').value=sp.get('t');
  if(sp.get('sort')==='added') $('#sort').value='added';
  const ids = (sp.get('ids')||'').split(',').filter(x=>/^(Q|M)\d+$/.test(x));
  if(ids.length){ await ensureIds(ids); ids.forEach(id=>add(PEOPLE[id],true)); }
  render();
})();
</script>
</body>
</html>
