<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>生没年グラフ</title>
<script>try{var t=JSON.parse(localStorage.getItem('sbg_view_v1')||'{}').theme;document.documentElement.dataset.theme=t||'auto';}catch(e){document.documentElement.dataset.theme='auto';}</script>
<style>
:root{
  --bg:#f6f3ec;--panel:#fffdf8;--ink:#23211d;--sub:#7a746a;--line:#e2ddd2;
  --accent:#c8553d;--ev:#2f6db5;--era1:rgba(120,100,60,.07);--era2:rgba(120,100,60,.0);
  --bs:52%;--bl:50%;--ovl:rgba(200,85,61,.13);--onaccent:#fff;
  --namew:150px;--colw:calc(36px*var(--fs));--fs:1;
}
:root[data-theme="white"]{--bg:#ffffff;--panel:#ffffff;--ink:#111111;--sub:#666666;--line:#dddddd;
  --accent:#d0472b;--ev:#1f5fbf;--era1:rgba(0,0,0,.045);--era2:rgba(0,0,0,0);--bs:58%;--bl:48%;--ovl:rgba(208,71,43,.12)}
:root[data-theme="dark"]{--bg:#16171a;--panel:#212226;--ink:#ecebe7;--sub:#9a978f;--line:#3a3b40;
  --accent:#ff7d5e;--ev:#6ea8ff;--era1:rgba(255,255,255,.05);--era2:rgba(255,255,255,0);--bs:55%;--bl:55%;--ovl:rgba(255,125,94,.16)}
:root[data-theme="board"]{--bg:#1d3329;--panel:#244034;--ink:#f4f1e4;--sub:#b9cdbf;--line:rgba(244,241,228,.2);
  --accent:#ffd66b;--ev:#9bd6ff;--era1:rgba(255,255,255,.06);--era2:rgba(255,255,255,0);--bs:60%;--bl:62%;--ovl:rgba(255,214,107,.14);--onaccent:#1d3329}
@media (prefers-color-scheme:dark){
  :root[data-theme="auto"]{--bg:#1c1d20;--panel:#25262a;--ink:#ecebe7;--sub:#9a978f;--line:#393a3f;
    --accent:#ff7d5e;--ev:#6ea8ff;--era1:rgba(255,255,255,.05);--era2:rgba(255,255,255,0);--bs:55%;--bl:55%;--ovl:rgba(255,125,94,.16)}
}
:root[data-font="ud"] body{font-family:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",system-ui,sans-serif}
:root[data-font="min"] body{font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif}
:root[data-font="maru"] body{font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN",system-ui,sans-serif}
:root[data-font="hand"] body{font-family:"Klee One","Hiragino Maru Gothic ProN",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:system-ui,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;font-size:14px}
header{padding:14px 16px 6px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h1{font-size:21px;margin:0;letter-spacing:.05em}
header .ver{color:var(--sub);font-size:12px}
.wrap{padding:0 16px 24px;max-width:1400px;margin:0 auto}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input[type=text],select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:6px 9px}
button{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:6px 12px}
.seg button.on{background:var(--accent);color:var(--onaccent)}
label.ck{display:inline-flex;gap:4px;align-items:center;font-size:13px;color:var(--sub);cursor:pointer}
.searchbox{position:relative;flex:1 1 220px;max-width:460px}
.zbar{display:flex;align-items:center;gap:8px;margin:0 0 6px}
.zbar[hidden]{display:none}
.zbtns{display:inline-flex}
.zbtns button{border-radius:0;margin-left:-1px;min-width:38px}
.zbtns button:first-child{border-radius:7px 0 0 7px}
.zbtns button:last-child{border-radius:0 7px 7px 0}
#namesBtn[aria-pressed="true"]{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
.mini{position:relative;flex:1;height:30px;background:var(--panel);border:1px solid var(--line);border-radius:7px;overflow:hidden;touch-action:none;cursor:pointer;min-width:80px}
.mlines{position:absolute;inset:3px 0}
.mlines i{position:absolute;height:2px;border-radius:1px;opacity:.8}
.mwin{position:absolute;top:0;bottom:0;border:2px solid var(--accent);border-radius:5px;background:var(--ovl);cursor:grab}
.mwin .mh{position:absolute;top:0;bottom:0;width:10px}
.mwin .mh.l{left:-6px;cursor:ew-resize}
.mwin .mh.r{right:-6px;cursor:ew-resize}
.mlab{position:absolute;bottom:1px;font-size:9.5px;color:var(--sub);pointer-events:none}
.mlab.l{left:4px}.mlab.r{right:4px}
.topbar{gap:6px}
.tog[aria-expanded="true"]{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
.sec{border-top:1px solid var(--line);margin-top:10px;padding-top:10px}
.sec[hidden]{display:none}
.setgrid{display:flex;flex-wrap:wrap;gap:8px 14px}
.setgrid label{display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:var(--sub)}
.setgrid select{min-width:120px}
.setgrid label.wide{flex:1 1 100%}
.setgrid label.wide input{max-width:480px}
.sh{font-size:12px;font-weight:700;color:var(--ink);margin:10px 0 5px;padding-bottom:2px;border-bottom:1px dashed var(--line)}
.sh:first-child{margin-top:0}
.menu{position:relative}
.mpop{position:absolute;right:0;top:calc(100% + 4px);background:var(--panel);border:1px solid var(--line);border-radius:9px;box-shadow:0 8px 24px rgba(0,0,0,.2);padding:6px;display:none;z-index:40;min-width:190px}
.mpop.on{display:flex;flex-direction:column;gap:4px}
.mpop button{text-align:left;border:0;background:none}
.mpop button:hover{background:var(--bg)}
.mpop hr{border:0;border-top:1px solid var(--line);margin:2px 0;width:100%}
#clear{color:var(--accent)}
.capturing .hscroll,.capturing .vscroll{max-height:none!important;overflow:visible!important}
.capturing .hinner,.capturing .H .track,.capturing .V .col{overflow:hidden}
.capturing .credit{display:block}
.capturing{padding:14px 16px 10px;background:var(--bg)}
.capturing #info,.capturing #zbar{display:none!important}
.capturing .ttl{box-shadow:none!important;background:none!important}
.capturing .chart{max-width:none}
.capturing .grip{visibility:hidden}
.searchbox input{width:100%}
.dd{position:absolute;left:0;right:0;top:100%;margin-top:3px;background:var(--panel);border:1px solid var(--line);
  border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.15);z-index:30;max-height:360px;overflow:auto;display:none}
.dd .it{padding:7px 10px;cursor:pointer;border-bottom:1px solid var(--line)}
.dd .it:last-child{border-bottom:0}
.dd .it:hover,.dd .it.on{background:var(--bg)}
.dd .it.off{opacity:.55}
.dd .it b{font-weight:600}
.dd .it small{color:var(--sub);display:block;font-size:11.5px}
.dd .msg{padding:8px 10px;color:var(--sub)}
.lbl{color:var(--sub);font-size:12px}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.presets button{font-size:12.5px;padding:4px 9px;border-radius:999px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;max-height:180px;overflow:auto}
.chip{font-size:12px;padding:3px 8px;border-radius:999px;border:1px solid var(--line);cursor:pointer;background:var(--bg)}
.chip:hover{border-color:var(--accent)}
.chip.in{opacity:.35}
.chip .cx{margin-left:6px;color:var(--sub);padding:0 2px}
.chip .cx:hover{color:var(--accent)}
.chip.editing{border-color:var(--accent);background:var(--ovl)}
.dd .it .tg{font-size:10px;border:1px solid var(--line);border-radius:3px;padding:0 3px;margin-left:4px;color:var(--sub)}
details summary{cursor:pointer;color:var(--sub);font-size:12.5px}
textarea{width:100%;min-height:80px}
.ttl{font-size:calc(20px*var(--fs));margin:4px 2px 6px;font-weight:700;outline:none;border-radius:6px}
.ttl:hover,.ttl:focus{background:var(--panel);box-shadow:0 0 0 1px var(--line)}
.credit{display:none;font-size:11px;color:var(--sub);text-align:right;padding:4px 4px 0}
#info{min-height:20px;color:var(--sub);font-size:12.5px;margin:2px 2px 6px}
#info b{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:50}
.toast.on{opacity:.92}
.empty{padding:40px 10px;text-align:center;color:var(--sub);line-height:1.9}

/* ===== グラフ共通 ===== */
.chart{font-size:calc(14px*var(--fs));background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px 12px;user-select:none;position:relative}
.era,.gridl,.ovl,.cline,.evl{position:absolute;pointer-events:none}
.ovl{background:var(--ovl)}
.cyear{position:absolute;background:var(--accent);color:var(--onaccent);font-size:calc(11px*var(--fs));border-radius:5px;padding:1px 6px;display:none;z-index:6;white-space:nowrap;pointer-events:none}
.bar{position:absolute;overflow:hidden;cursor:pointer;font-size:calc(11px*var(--fs));color:#fff;border-radius:5px;box-shadow:none}
.bar .lb{position:absolute;display:flex;align-items:center;gap:5px;padding:0 6px;white-space:nowrap;text-shadow:0 0 3px rgba(0,0,0,.35)}
.bar .lb b,.lbo b{font-weight:700}
.bar.period{border-radius:1px}
.bar.period::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.22) 0 5px,transparent 5px 10px);pointer-events:none}
.lbo{position:absolute;display:none;align-items:center;gap:5px;font-size:calc(11px*var(--fs));color:var(--ink);white-space:nowrap;pointer-events:none}
.lbo span{color:var(--sub)}
.age{position:absolute;font-size:calc(11px*var(--fs));background:var(--panel);border:1px solid var(--line);color:var(--ink);
  border-radius:4px;padding:0 4px;display:none;pointer-events:none;z-index:4;white-space:nowrap}
.sel .bar{outline:2.5px solid var(--ink);outline-offset:1px}
.dh{cursor:default}
.dh .grip{color:var(--sub);opacity:.5;font-size:calc(11px*var(--fs));letter-spacing:-2px}
.dh .x{border:0;background:none;color:var(--sub);padding:0 3px;font-size:calc(14px*var(--fs));visibility:hidden;cursor:pointer}
.dh:hover .x{visibility:visible}
.dh .tag{font-size:calc(10px*var(--fs));color:var(--sub);border:1px solid var(--line);border-radius:3px;padding:0 3px}
.dragging{opacity:.45}
.seglb{position:absolute;overflow:hidden;white-space:nowrap;font-size:calc(10.5px*var(--fs));color:var(--sub)}
.gseg{position:absolute;overflow:hidden;white-space:nowrap;font-size:calc(10px*var(--fs));color:var(--sub);border-color:var(--line);border-style:solid;border-width:0}
.gseg.alt{background:var(--era1)}
.gseg{cursor:pointer}
.gseg.tiny{background:none!important;color:transparent!important;overflow:visible}
.H .gseg.tiny::after{content:"";position:absolute;top:0;bottom:0;left:-4px;right:-4px}
.V .gseg.tiny::after{content:"";position:absolute;left:0;right:0;top:-4px;bottom:-4px}
.gpop{position:fixed;z-index:60;background:var(--ink);color:var(--bg);font-size:calc(12px*var(--fs));padding:4px 8px;border-radius:6px;white-space:nowrap;pointer-events:none;display:none;box-shadow:0 3px 10px rgba(0,0,0,.25)}
.evlb{position:absolute;font-size:calc(10.5px*var(--fs));color:var(--ev);white-space:nowrap;background:var(--panel);padding:0 3px;border-radius:3px;z-index:3;pointer-events:auto;cursor:pointer}
.evlb:hover{text-decoration:underline}
.evpop{position:fixed;z-index:61;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:9px;box-shadow:0 8px 24px rgba(0,0,0,.22);padding:8px 10px;font-size:calc(13px*var(--fs));display:none;max-width:280px}
.evpop .t{font-weight:700;margin-bottom:2px}
.evpop .nt{color:var(--sub);font-size:calc(11.5px*var(--fs));margin-bottom:6px}
.evpop button{font-size:calc(12px*var(--fs));padding:4px 10px;color:var(--accent)}
.evl{border-color:var(--ev);border-style:dashed;border-width:0;opacity:.8}

/* ===== 横 ===== */
.H{padding:0;overflow:hidden}
.H .hscroll{overflow:auto;max-height:calc(100vh - 30px);touch-action:pan-x pan-y}
/* すくろーるばーをいつも見えるように（Macの「使うときだけ出る」でも消えない） */
.hscroll,.vscroll{scrollbar-width:auto;scrollbar-color:var(--sub) var(--bg)}
.hscroll::-webkit-scrollbar,.vscroll::-webkit-scrollbar{width:12px;height:12px;background:var(--bg)}
.hscroll::-webkit-scrollbar-thumb,.vscroll::-webkit-scrollbar-thumb{background:var(--sub);border-radius:8px;border:3px solid var(--bg)}
.hscroll::-webkit-scrollbar-thumb:hover,.vscroll::-webkit-scrollbar-thumb:hover{background:var(--accent)}
.hscroll::-webkit-scrollbar-corner,.vscroll::-webkit-scrollbar-corner{background:var(--bg)}
.panning,.panning *{cursor:grabbing!important;user-select:none}
.zoomed .hscroll,.zoomed .vscroll{cursor:grab}
.H .hinner{position:relative;padding:0 10px 12px 0}
.H .axis{display:flex;position:sticky;top:0;background:var(--panel);z-index:5;padding-top:4px}
.H .axis .namecol{position:sticky;left:0;z-index:6;background:var(--panel)}
.H .namecol{width:var(--namew);flex:none}
.H .atrack{position:relative;flex:1;border-bottom:1px solid var(--line)}
.H .arow{position:relative}
.H .arow.era{height:calc(15px*var(--fs))}
.H .arow.gen{height:calc(16px*var(--fs));border-top:1px solid var(--line)}
.H .arow.ev{height:calc(16px*var(--fs))}
.H .arow.tk{height:calc(24px*var(--fs))}
.H .arow.tk.g2{height:calc(36px*var(--fs))}
.H .arow.tk.g3{height:calc(48px*var(--fs))}
.H .seglb{top:0;height:calc(15px*var(--fs));padding-left:3px}
.H .gseg{top:1px;height:calc(14px*var(--fs));line-height:calc(14px*var(--fs));padding-left:2px;border-left-width:1px}
.H .gseg.n{height:7px;line-height:7px;font-size:calc(7px*var(--fs))}
.H .gseg.s{top:8px;height:7px;line-height:7px;font-size:calc(7px*var(--fs))}
.H .tick{position:absolute;bottom:0;transform:translateX(-50%);font-size:calc(11px*var(--fs));color:var(--sub);padding-bottom:3px;white-space:nowrap;text-align:center;line-height:1.15}
.H .tick small{display:block;font-size:calc(9.5px*var(--fs))}
.H .evlb{top:1px;transform:translateX(-50%)}
.H .cyear{bottom:3px;transform:translateX(-50%)}
.H .body{position:relative}
.H .bg{position:absolute;left:var(--namew);right:0;top:0;bottom:0;pointer-events:none}
.H .era,.H .gridl,.H .ovl,.H .cline,.H .evl{top:0;bottom:0}
.H .gridl{border-left:1px dashed var(--line)}
.H .ovl{border-left:1px solid var(--accent);border-right:1px solid var(--accent)}
.H .cline{border-left:1.5px solid var(--accent);display:none}
.H .evl{border-left-width:1.5px}
.H .row{display:flex;align-items:center;height:calc(30px*var(--fs));position:relative}
.H .row.ins-b{box-shadow:inset 0 3px 0 var(--accent)}
.H .row.ins-a{box-shadow:inset 0 -3px 0 var(--accent)}
.H .name{width:var(--namew);flex:none;display:flex;align-items:center;gap:3px;padding:0 8px 0 4px;overflow:hidden;height:100%;position:sticky;left:0;z-index:3;background:var(--panel)}
.grip{cursor:grab;touch-action:none;padding:4px 3px;border-radius:4px}
.grip:hover{background:var(--bg)}
.dh{cursor:default;touch-action:auto}
.fold .H .name{padding:0;justify-content:center}
.fold .dh .nm,.fold .dh .x,.fold .dh .tag{display:none}
.fold .V .vhead{padding:2px 0}
.H .name span.nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.H .sel .name span.nm{font-weight:700}
.H .track{position:relative;flex:1;height:100%}
.H .bar{top:calc(5px*var(--fs));height:calc(20px*var(--fs))}
.H .bar .lb{top:0;bottom:0}
.H .bar.fb{border-top-left-radius:0;border-bottom-left-radius:0}
.H .bar.fd,.H .bar.unknown,.H .bar.alive{border-top-right-radius:0;border-bottom-right-radius:0}
.H .bar.alive{box-shadow:inset -3px 0 0 rgba(255,255,255,.55)}
.H .lbo{top:calc(5px*var(--fs));height:calc(20px*var(--fs))}
.H .age{top:calc(6px*var(--fs));transform:translateX(4px)}

/* ===== 縦 ===== */
.V{padding:0;overflow:hidden}
.V .vscroll{overflow:auto;max-height:calc(100vh - 30px);touch-action:pan-x pan-y}
.V .vgrid{display:grid;position:relative}
.V .corner{position:sticky;top:0;left:0;z-index:8;background:var(--panel);border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
.V .vhead{position:sticky;top:0;z-index:7;background:var(--panel);border-bottom:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:4px 0;gap:3px;overflow:hidden}
.V .vhead span.nm{writing-mode:vertical-rl;font-size:calc(12.5px*var(--fs));line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-height:0}
.V .vhead .grip{writing-mode:horizontal-tb;letter-spacing:-2px}
.V .vhfill{position:sticky;top:0;z-index:7;background:var(--panel);border-bottom:1px solid var(--line)}
.V .vhead.ins-b{box-shadow:inset 3px 0 0 var(--accent)}
.V .vhead.ins-a{box-shadow:inset -3px 0 0 var(--accent)}
.V .sel.vhead span.nm{font-weight:700}
.V .vaxis{position:sticky;left:0;z-index:6;background:var(--panel);border-right:1px solid var(--line)}
.V .seglb{left:0;width:calc(18px*var(--fs));writing-mode:vertical-rl;padding-top:3px;line-height:calc(18px*var(--fs))}
.V .gseg{width:calc(18px*var(--fs));writing-mode:vertical-rl;padding-top:2px;line-height:calc(17px*var(--fs));border-top-width:1px}
.V .gseg.n{width:calc(9px*var(--fs));line-height:calc(9px*var(--fs));font-size:calc(7px*var(--fs))}
.V .gseg.s{width:calc(9px*var(--fs));line-height:calc(9px*var(--fs));font-size:calc(7px*var(--fs))}
.V .tick{position:absolute;right:4px;transform:translateY(-50%);font-size:calc(11px*var(--fs));color:var(--sub);white-space:nowrap;text-align:right;line-height:1.1}
.V .tick small{display:block;font-size:calc(9.5px*var(--fs))}
.V .cyear{transform:translateY(-50%);z-index:9}
.V .vbody{position:relative}
.V .bg{position:absolute;inset:0;pointer-events:none}
.V .era,.V .gridl,.V .ovl,.V .cline,.V .evl{left:0;right:0}
.V .gridl{border-top:1px dashed var(--line)}
.V .ovl{border-top:1px solid var(--accent);border-bottom:1px solid var(--accent)}
.V .cline{border-top:1.5px solid var(--accent);display:none}
.V .evl{border-top-width:1.5px}
.V .evlb{left:2px;transform:translateY(-100%)}
.V .cols{position:absolute;inset:0;display:flex}
.V .col{position:relative;width:var(--colw);flex:none;height:100%}
.V .bar{left:calc(6px*var(--fs));width:calc(24px*var(--fs))}
.V .bar .lb{left:0;right:0;writing-mode:vertical-rl;padding:6px 0;justify-content:flex-start;line-height:calc(24px*var(--fs))}
.V .bar.fb{border-top-left-radius:0;border-top-right-radius:0}
.V .bar.fd,.V .bar.unknown,.V .bar.alive{border-bottom-left-radius:0;border-bottom-right-radius:0}
.V .bar.alive{box-shadow:inset 0 -3px 0 rgba(255,255,255,.55)}
.V .lbo{left:calc(6px*var(--fs));width:calc(24px*var(--fs));writing-mode:vertical-rl;justify-content:flex-start;line-height:calc(24px*var(--fs))}
.V .age{left:2px;transform:translateY(-120%)}
@media (max-width:640px){:root{--namew:96px}}
</style>
</head>
<body>
<header><h1>生没年グラフ</h1><span class="ver">v0.16</span><span class="lbl" id="dataStat"></span></header>
<div class="wrap">

  <div class="panel">
    <div class="ctrl topbar">
      <div class="searchbox">
        <input type="text" id="q" placeholder="人・できごと・期間を探して追加（例：織田信長、応仁の乱）" autocomplete="off">
        <div class="dd" id="dd"></div>
      </div>

const GENGO = (()=>{
  const all=GENGO_RAW.map(([n,s,e,k])=>({n,s,e,k}));
  const north=all.filter(x=>x.k!=='S'), south=all.filter(x=>x.k==='S'||x.k==='B');
  const chain=list=>list.map((x,i)=>{ const nx=list[i+1]; return {...x, last: nx ? Math.min(x.e, nx.s) : x.e}; });
  return {north:chain(north), south:chain(south)};
})();
const gy=(x,Y)=>{ const k=Y-x.s+1; return x.n+(k===1?'元':k)+'年'; };
// その年の元号（改元の年は2つ）
function gengoAt(Y){
  if(Y<645) return null;
  const pick=ch=>ch.filter(x=>x.s<=Y && Y<=x.last);
  const n=pick(GENGO.north);
  if(Y>=NB_FROM && Y<=NB_TO){
    const s=pick(GENGO.south).filter(x=>Y<=NB_TO);
    const a=n.map(x=>gy(x,Y)).join('／'), b=s.map(x=>gy(x,Y)).join('／');
    if(!b || a===b) return a||null;
    return `北朝 ${a}・南朝 ${b}`;
  }

function gengoSegs(min,max){
  const out=[];

  const segOf=(ch,i)=>{ const x=ch[i], nx=ch[i+1]; return [x.s, nx ? nx.s : Math.max(x.e+1, x.s+1)]; };

    if(GENGO.north[i+1] && x.e+1 < GENGO.north[i+1].s) e=x.e+1;   // 元号のない時期（白雉〜朱鳥など）

}

function cnSegs(min,max){
  const out=[]; const a=Math.max(Math.ceil(min),-139), b=Math.min(Math.floor(max),1949);
  let cur=null;
  for(let Y=a; Y<=b; Y++){
    const l=cnActive(Y,true); const x=l.length ? l.reduce((p,q)=>q.s>=p.s?q:p) : null;
    const key = x ? x.d+'|'+x.n+'|'+x.s : '';
    if(cur && cur.key===key){ cur.e=Y+1; continue; }
    if(cur && cur.key) out.push(cur);
    cur = {key, n:x?x.n:'', d:x?x.d:'', s:Y, e:Y+1, lane:'all', rs:x?x.s:0, re:x?x.e:0};

}

// 年の書き方 → [始まり, 終わり, 表示]
function pyear(t){
  t=String(t).trim();
  let m;
  if(t==='now') return [CUR,CUR,'今'];
  if((m=/^(前)?(\d+)世紀(初め|前半|後半|末)?$/.exec(t))){
    const c=+m[2]; let lo, hi;
    if(m[1]){ lo=1-c*100; hi=lo+99; } else { lo=(c-1)*100+1; hi=c*100; }
    if(m[3]==='初め') hi=lo+19; if(m[3]==='前半') hi=lo+49; if(m[3]==='後半') lo=lo+50; if(m[3]==='末') lo=hi-19;
    return [lo,hi,t];
  }
  const circa=/頃$/.test(t); const y=inYear(t.replace(/頃$/,''));
  if(y==null || Number.isNaN(y)) return null;
  return circa ? [y-3,y+3,t] : [y,y,t];
}
// プリセットの1行 → 期間（帯）
function presetPeriod(it){
  const B=pyear(it.b), D=pyear(it.d); if(!B||!D) return null;
  const bl = it.bs ? it.bs.map(pyear).filter(Boolean) : [B];
  const dl = it.ds ? it.ds.map(pyear).filter(Boolean) : [D];
  const p={type:'period', n:it.n, b:Math.min(...bl.map(x=>x[0])), d:Math.min(...dl.map(x=>x[0]))};
  const bh=Math.max(...bl.map(x=>x[1])), dh=Math.max(...dl.map(x=>x[1]));
  if(bh>p.b) p.b2=bh; if(dh>p.d) p.d2=dh;
  p.bm = B[0]===B[1] ? B[0] : Math.round((B[0]+B[1])/2); p.dm = D[0]===D[1] ? D[0] : Math.round((D[0]+D[1])/2);
  p.bl = B[2]; p.dl = it.d==='now' ? '' : D[2];
  if(it.bs) p.bv=it.bs.map(x=>pyear(x)[2]); if(it.ds) p.dv=it.ds.map(x=>pyear(x)[2]);
  if(it.d==='now') p.now=1;
  if(it.note) p.note=it.note;
  return p;
}

// 1人ぶんの形：{id,n,desc,links, b,b2,bc,bv, d,d2,dc,dv,du, f,f2}
//  b/d = 生年/没年（いちばん早い方）、b2/d2 = 幅があるときの遅い方
//  bc/dc = 「頃」、bv/dv = 表示用の説の一覧、du = 没年「不明」と登録、f/f2 = 活動時期
const WD_CIRCA='Q5727902';
const PFIELDS=['b','b2','bc','bv','d','d2','dc','dv','du','f','f2'];
function yearRange(y, prec){
  if(prec==null||prec>=9) return [y,y];
  if(prec===8){ const lo=Math.floor(y/10)*10; return [lo,lo+9]; }
  if(prec===7){ const c=Math.floor((y-1)/100); return [c*100+1,c*100+100]; }
  if(prec===6){ const m=Math.floor((y-1)/1000); return [m*1000+1,m*1000+1000]; }
  return [y,y];
}
function yearLabel(y, prec, circa){
  const Y=v=>v<=0?'前'+(1-v):String(v);
  if(prec===8 && y>0) return Math.floor(y/10)*10+'年代';
  if(prec===7){ const c=Math.floor((y-1)/100)+1; return (c<=0?'前'+(1-c):c)+'世紀'; }
  if(prec===6){ const m=Math.floor((y-1)/1000)+1; return (m<=0?'前'+(1-m):m)+'千年紀'; }
  if(prec!=null && prec<9) return Y(y)+'頃';
  return Y(y)+(circa?'頃':'');
}
function summarize(list){
  if(!list||!list.length) return null;
  const pref=list.filter(s=>s.rank==='p'); const use=pref.length?pref:list;
  const known=use.filter(s=>s.y!=null);
  if(!known.length) return {unknown:true};
  let lo=Infinity, hi=-Infinity, circa=false; const labels=[];
  for(const s of known){
    const [a,b]=yearRange(s.y,s.prec); lo=Math.min(lo,a); hi=Math.max(hi,b);
    if(s.circa || (s.prec!=null && s.prec<6)) circa=true;
    const L=yearLabel(s.y,s.prec,s.circa); if(!labels.includes(L)) labels.push(L);
  }
  const out={lo,hi,circa};
  if(labels.length>1 || circa || hi>lo) out.labels=labels;
  return out;
}

    OPTIONAL { ?s pq:P1480 ?circa }

}`;
}
function digestPeople(rows, out){
  for(const r of rows){
    const id=r.p.value.split('/').pop();
    const o=out[id]||(out[id]={id,n:null,desc:'',links:null,_en:null,_st:{b:new Map(),d:new Map(),f:new Map()}});
    if(r.jl) o.n=r.jl.value; if(r.el) o._en=r.el.value; if(r.jd) o.desc=r.jd.value;
    if(r.sl) o.links=+r.sl.value;
    if(r.k && r.s){
      const m=o._st[r.k.value]; let st=m.get(r.s.value);
      if(!st){ st={rank:/Preferred/.test(r.rank?r.rank.value:'')?'p':'n', y:null, prec:null, circa:false}; m.set(r.s.value,st); }
      if(r.t){ const y=parseYear(r.t.value); if(y!=null){ st.y=y; st.prec=r.prec?+r.prec.value:null; } }
      if(r.circa && r.circa.value.endsWith(WD_CIRCA)) st.circa=true;
    }
  }
}
function finishPerson(o){
  const B=summarize([...o._st.b.values()]), D=summarize([...o._st.d.values()]), F=summarize([...o._st.f.values()]);
  const p={id:o.id, n:o.n||o._en||o.id, desc:o.desc, links:o.links, b:null, d:null};
  if(B && !B.unknown){ p.b=B.lo; if(B.hi>B.lo) p.b2=B.hi; if(B.circa) p.bc=1; if(B.labels) p.bv=B.labels; }
  if(D && !D.unknown){ p.d=D.lo; if(D.hi>D.lo) p.d2=D.hi; if(D.circa) p.dc=1; if(D.labels) p.dv=D.labels; }
  if(D && D.unknown) p.du=1;
  if(F && !F.unknown){ p.f=F.lo; if(F.hi>F.lo) p.f2=F.hi; }
  return p;
}
// id の配列 → 人物情報（人間だけ）
async function fetchPeople(ids, size=80, prog){
  const out={};
  for(let i=0;i<ids.length;i+=size){
    if(prog) prog(i, ids.length);
    if(i) await sleep(250);
    digestPeople(await sparql(peopleQuery(ids.slice(i,i+size))), out);
  }
  const res={}; for(const id in out) res[id]=finishPerson(out[id]);
  return res;
}
function pickFields(p){ const o={id:p.id, n:p.n, desc:p.desc||''}; for(const k of PFIELDS) if(p[k]!=null) o[k]=p[k]; if(o.d===undefined) o.d=null; return o; }
// 表示用
const midB=p=>Math.round((p.b+(p.b2??p.b))/2);
const midD=p=>Math.round((p.d+(p.d2??p.d))/2);
const fuzzB=p=>p.b2!=null||!!p.bc;
const fuzzD=p=>p.d2!=null||!!p.dc;
function txtOf(v, mid, list){ if(list && list.length===1) return list[0]; if(list && list.length>1) return yearLabel(mid,9,true); return v<=0?'前'+(1-v):String(v); }
const birthTxt=p=>p.b==null?'':txtOf(p.b, midB(p), p.bv);
const deathTxt=p=>p.d==null?(p.du?'不明':''):txtOf(p.d, midD(p), p.dv);
function noteOf(p){
  const a=[];
  if(p.bv && p.bv.length>1) a.push('生年 諸説：'+p.bv.join('・'));
  if(p.dv && p.dv.length>1) a.push('没年 諸説：'+p.dv.join('・'));
  if(p.du) a.push('没年 不明');
  if(p.f!=null) a.push('活動時期：'+yearLabel(p.f,9)+(p.f2!=null?'〜'+yearLabel(p.f2,9):''));
  return a.join(' ／ ');
}

function remember(p){ PEOPLE[p.id]=p; if(!DATA || !DATA.people || !DATA.people[p.id]){ cache[p.id]=pickFields(p); lsSet(CACHE_KEY,cache); } }
async function searchHumans(q){
  const hits = await wdSearch(q);
  if(!hits.length) return [];
  const ppl = await fetchPeople(hits.map(h=>h.id).filter(id=>!PEOPLE[id]));
  const res = [];
  for(const h of hits){
    const p = PEOPLE[h.id] || ppl[h.id];
    if(p && p.b!=null && !isPeriod(p)){ if(!p.desc && h.description) p.desc=h.description; res.push(p); }
  }
  return res;
}
function localMatch(q, limit=6){
  q=q.trim(); if(!q) return [];
  const exact=[], part=[];
  for(const p of Object.values(PEOPLE)){
    if(p.b==null || isPeriod(p)) continue;
    if(p.n===q) exact.push(p); else if(p.n.includes(q)) part.push(p);
  }
  return exact.concat(part).slice(0,limit);
}
async function resolveName(name){
  name=name.trim(); if(!name) return null;
  const loc = localMatch(name,1); if(loc.length && loc[0].n===name) return loc[0];
  try{ const r = await searchHumans(name); if(r.length){ remember(r[0]); return r[0]; } }catch(e){}
  return loc[0] || null;
}
async function ensureIds(ids){
  const need = ids.filter(id=>/^Q\d+$/.test(id) && !PEOPLE[id]);
  if(need.length){ try{ const got = await fetchPeople(need); Object.values(got).forEach(remember); }catch(e){ toast('Wikidataにつながらない…'); } }
}

/* ---------- 追加・削除・URL ---------- */
function add(p, silent){

const cleanTxt = s => String(s).replace(/[~|]/g,' ');
let READY=false;            // 起動が終わるまでURLは書きかえない（共有URLの中身を消さないため）
function syncURLSoon(){ clearTimeout(syncURLSoon._t); syncURLSoon._t=setTimeout(syncURL, 400); }
// 見た目の設定をURL用の短い文字に：向き-色-元号-ちぇっく-背景-並べ順
function viewCode(){ const f=(SET.gtick?1:0)+(SET.gband?2:0)+(SET.glabel?4:0)+(SET.eralbl?8:0);
  return [SET.orient, SET.theme, SET.gmode, f, $('#era').value, $('#sort').value, SET.lpos, SET.font, String(SET.fs||1)].join('-'); }
function readViewCode(v){
  const [o,th,g,f,era,sort,lp,fo,fz]=(v||'').split('-'); if(!o) return;
  if(['sys','ud','min','maru','hand'].includes(fo)) SET.font=fo;
  if(['0.85','1','1.25','1.6'].includes(fz)) SET.fs=+fz;

  if(['jp','world','cn','none'].includes(era)) $('#era').value=era;
  if(['birth','death','life','added'].includes(sort)) $('#sort').value=sort;

// ---- 共有URLを短く：中身をまとめて圧縮（deflate）して1つの s= に ----
const canZip = typeof CompressionStream!=='undefined' && typeof DecompressionStream!=='undefined';
const b64u = bytes => { let s=''; for(const b of bytes) s+=String.fromCharCode(b); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); };
const unb64u = t => { t=t.replace(/-/g,'+').replace(/_/g,'/'); while(t.length%4) t+='='; const s=atob(t); return Uint8Array.from(s, c=>c.charCodeAt(0)); };
async function zipStr(str){ const cs=new Blob([str]).stream().pipeThrough(new CompressionStream('deflate-raw')); return b64u(new Uint8Array(await new Response(cs).arrayBuffer())); }
async function unzipStr(t){ const ds=new Blob([unb64u(t)]).stream().pipeThrough(new DecompressionStream('deflate-raw')); return await new Response(ds).text(); }
function presetKey(o, key){   // プリセットの何番目か（古いデータは名前から探す）
  if(o.pk) return o.pk;
  for(let i=0;i<PERIOD_PRESETS.length;i++){ const j=(PERIOD_PRESETS[i][key]||[]).findIndex(it=>it.n===o.n); if(j>=0) return [i,j]; }
  return null;
}
function packState(){
  const L=list.map(id=>{ const p=PEOPLE[id];
    if(/^Q\d+$/.test(id)) return +id.slice(1);
    if(p && p.pre){ const k=presetKey(p,'items'); if(k) return k; }
    return ['p', p.n, p.b, p.d]; });
  const E=events.map(e=>{ if(e.pre){ const k=presetKey(e,'events'); if(k) return k; } return ['e', e.n, e.y]; });
  const o={L, v:viewCode()};
  if(E.length) o.E=E;
  const t=$('#title').value.trim(); if(t) o.t=t;
  const sel=selected.map(id=>list.indexOf(id)).filter(i=>i>=0); if(sel.length) o.s=sel;
  if(ZOOM>1.01){ const vi=viewInfo(); if(vi){ o.z=+ZOOM.toFixed(2); o.c=Math.round(vi.center); } }
  return JSON.stringify(o);
}
async function unpackState(o){
  if(o.v) readViewCode(o.v);
  if(o.t) $('#title').value=o.t;
  const ids=[];
  for(const x of o.L||[]){
    if(typeof x==='number'){ ids.push('Q'+x); continue; }
    const id='M'+(manSeq++);
    if(Array.isArray(x) && x[0]==='p'){ PEOPLE[id]={id, n:x[1], type:'period', b:x[2], d:x[3]}; ids.push(id); continue; }
    if(Array.isArray(x) && typeof x[0]==='number'){ const it=(PERIOD_PRESETS[x[0]]||{}).items?.[x[1]]; const q=it&&presetPeriod(it); if(q){ PEOPLE[id]={id,...q,pre:1,pk:x}; ids.push(id); } }
  }
  for(const x of o.E||[]){
    const id='E'+(manSeq++);
    if(Array.isArray(x) && x[0]==='e') events.push({id, n:x[1], y:x[2]});
    else if(Array.isArray(x)){ const it=(PERIOD_PRESETS[x[0]]||{}).events?.[x[1]]; if(it) events.push({...presetEvent(it,id), pk:x}); }
  }
  events.sort((a,b)=>a.y-b.y);
  return ids;
}
let urlSeq=0;
async function syncURL(){
  if(!READY) return;
  if(canZip){
    const my=++urlSeq, z=await zipStr(packState()); if(my!==urlSeq) return;
    const u=new URL(location.href); u.search='?s='+z; history.replaceState(null,'',u); return;
  }
  syncURLPlain();
}
function syncURLPlain(){
  const u = new URL(location.href);
  const setp=(k,v)=>{ if(v) u.searchParams.set(k,v); else u.searchParams.delete(k); };
  setp('ids', list.join(','));
  const man=[...list.filter(id=>/^M/.test(id)).map(id=>{const p=PEOPLE[id]; return p.pre ? `${id}~P~${cleanTxt(p.n)}` : `${id}~p~${cleanTxt(p.n)}~${p.b}~${p.d}`;}),
             ...events.map(e=>e.pre ? `${e.id}~Q~${cleanTxt(e.n)}` : `${e.id}~e~${cleanTxt(e.n)}~${e.y}`)];
  setp('m', man.join('|'));
  setp('t', $('#title').value.trim());
  u.searchParams.delete('sort');
  setp('v', viewCode());
  setp('sel', selected.join(','));
  const vi = ZOOM>1.01 ? viewInfo() : null;
  setp('z', vi ? ZOOM.toFixed(2) : ''); setp('c', vi ? String(Math.round(vi.center)) : '');
  history.replaceState(null,'',u);
}
function readManualParam(v){
  for(const part of (v||'').split('|')){
    const [id,k,n,a,b]=part.split('~'); if(!id||!n) continue;
    const num=+id.slice(1); if(num>=manSeq) manSeq=num+1;
    if(k==='p' && /^M\d+$/.test(id)) PEOPLE[id]={id,n,type:'period',b:+a,d:+b};
    if(k==='e' && /^E\d+$/.test(id)) events.push({id,n,y:+a});
    if(k==='P' && /^M\d+$/.test(id)){ const it=findPresetItem(n,'items'); if(it){ const q=presetPeriod(it); if(q) PEOPLE[id]={id,...q,pre:1}; } }
    if(k==='Q' && /^E\d+$/.test(id)){ const it=findPresetItem(n,'events'); if(it) events.push(presetEvent(it,id)); }
  }
}

function findPresetItem(n, key){ for(const ps of PERIOD_PRESETS) for(const it of (ps[key]||[])) if(it.n===n) return it; return null; }
function presetEvent(it, id){ const Y=pyear(it.y); return {id, n:it.n, y:Y[0], note:it.note||'', pre:1}; }
// プリセットを今の画面に足す（同じ名前のものはとばす）
function addPresetSet(i){
  const ps=PERIOD_PRESETS[i]; let nA=0;
  const have=new Set([...list.map(id=>PEOPLE[id]&&PEOPLE[id].n), ...events.map(e=>e.n)]);
  for(const it of ps.items||[]){ if(have.has(it.n)) continue; const q=presetPeriod(it); if(!q) continue;
    const id='M'+(manSeq++); PEOPLE[id]={id,...q,pre:1, pk:[i,(ps.items||[]).indexOf(it)]}; list.push(id); nA++; }
  for(const it of ps.events||[]){ if(have.has(it.n)) continue; events.push({...presetEvent(it,'E'+(manSeq++)), pk:[i,ps.events.indexOf(it)]}); nA++; }
  events.sort((x,y)=>x.y-y.y);
  toast(nA ? `「${ps.name}」を${nA}こ足した` : 'もう全部入ってる');
  render(); syncURL();
}

/* ---------- 並べ順・形 ---------- */
function bZone(p){ let a=p.b, z=p.b2??p.b; if(p.bc && z-a<2){ a-=3; z+=3; } return [a,z]; }
function endOf(p){
  if(p.now) return {kind:'alive', a:CUR, z:CUR, y:CUR};
  if(p.d!=null){ let a=p.d, z=p.d2??p.d; if(p.dc && z-a<2){ a-=3; z+=3; } return {kind:'dead', a, z, y:midD(p)}; }
  if(p.du || p.b < CUR-115){
    const base=Math.max((p.b2??p.b)+30, p.f2??-1e9, p.f??-1e9);
    const a=Math.min(base,CUR), z=Math.min(base+40,CUR); return {kind:'unknown', a, z, y:a};
  }
  return {kind:'alive', a:CUR, z:CUR, y:CUR};
}
function periodNote(p){
  const a=[];
  if(p.bv && p.bv.length>1) a.push('始まり 諸説：'+p.bv.join('・'));
  if(p.dv && p.dv.length>1) a.push('終わり 諸説：'+p.dv.join('・'));
  if(p.note) a.push(p.note);
  if(!p.pre) a.push('自分で足した期間');
  return a.join(' ／ ');
}
function life(p){ const e=endOf(p); return e.kind==='dead' ? e.y - midB(p) : null; }
const lifeFuzzy=p=>fuzzB(p)||fuzzD(p);
function colorH(id){ if(!(id in colorIdx)) colorIdx[id]=nextColor++; return ((colorIdx[id]*137.508+15)%360).toFixed(1); }
function sorted(){
  const ps = list.map(id=>PEOPLE[id]).filter(Boolean);
  const m = $('#sort').value;
  if(m==='birth') ps.sort((a,b)=>midB(a)-midB(b));
  if(m==='death') ps.sort((a,b)=>endOf(a).y-endOf(b).y);
  if(m==='life') ps.sort((a,b)=>(life(b)??-1)-(life(a)??-1));
  return ps;
}
function niceStep(span, maxTicks){
  for(const s of [1,2,5,10,20,25,50,100,200,250,500,1000,2000]) if(span/s <= maxTicks) return s;
  return 5000;
}
// 1人ぶんの帯のかたち
function barOf(p){
  const e = endOf(p), [ba,bz] = bZone(p);
  const h = colorH(p.id), c = `hsl(${h} var(--bs) var(--bl))`;
  const left = ba, right = Math.max(e.z, bz+0.5), w = right-left;
  const pc = v => ((v-left)/w*100).toFixed(2)+'%';
  // ぼかしは透明（0）から、なめらかなカーブで色に（地の色に溶けるように）
  const EASE = [[0,0],[.15,.04],[.3,.13],[.45,.28],[.6,.47],[.75,.68],[.88,.86],[1,1]];
  const ramp = (from, to, rev) => EASE.map(([t,a])=>{ const x=from+(to-from)*t; const al = rev ? 1-a : a;
    return `hsl(${h} var(--bs) var(--bl) / ${al.toFixed(2)}) ${((x-left)/w*100).toFixed(2)}%`; });
  const st = [];
  if(bz>ba) st.push(...ramp(ba, bz, false)); else st.push(`${c} 0%`);
  if(e.z>e.a) st.push(...ramp(e.a, e.z, true)); else st.push(`${c} 100%`);
  let txt;
  if(isPeriod(p)){ const bm=p.bm??p.b, dm=p.dm??p.d, fz=p.b2!=null||p.d2!=null||/頃|世紀/.test((p.bl||'')+(p.dl||''));
    txt = `${p.bl||fmtY(p.b)}–${p.now?'今':(p.dl||fmtY(p.d))}（${fz?'約':''}${dm-bm}年間${p.now?'〜':''}）`; }
  else {
    const lf = life(p), fz = lifeFuzzy(p);
    const dt = e.kind==='dead' ? deathTxt(p) : e.kind==='alive' ? '存命' : (p.du?'不明':'?');
    txt = `${birthTxt(p)}–${dt}${lf!=null?`（${fz?'約':''}${lf}）`:''}`;
  }
  const cls = ['bar', e.kind, bz>ba?'fb':'', e.kind==='dead'&&e.z>e.a?'fd':'', isPeriod(p)?'period':''].join(' ');
  const lbAt = bz>ba && (e.a-bz) > w*0.35 ? pc(bz) : '0%';
  return {e, left, right, st, txt, cls, lbAt, note: isPeriod(p)?periodNote(p):noteOf(p),
    ageB: midB(p), ageF: isPeriod(p)?'p':(lifeFuzzy(p)?'1':'0'), ua: e.kind==='unknown'?e.a:''};
}

/* ---------- 描画 ---------- */
let geo = null; // {min,max,V,AX,HEAD}
let AX_=0, HEAD_=118;
let RANGE=null;   // 画像を作るときだけ使う、表示する年の範囲
let ZOOM=1, pendingAnchor=null;   // ズーム倍率と、描きなおしたあとに合わせる年
const ZMAX=400;
// いま見えてる真ん中の年（描きなおしても同じところを見るため）
function viewInfo(){
  if(!geo) return null;
  const sc = $(geo.V?'#chart .vscroll':'#chart .hscroll'); if(!sc) return null;
  const len = geo.len, span=geo.max-geo.min;
  const vis = geo.V ? sc.clientHeight-geo.HEAD : sc.clientWidth-geo.NW;
  const pos = geo.V ? sc.scrollTop : sc.scrollLeft;
  return {sc, len, vis, pos, span, center: geo.min + (pos+vis/2)/len*span};
}
function render(){
  const chart = $('#chart');

    $('#info').innerHTML=''; $('#zbar').hidden=true; return;
  }
  const bars = ps.map(p=>({p, g:barOf(p)}));
  let min = Math.min(...bars.map(b=>b.g.left), ...events.map(e=>e.y));
  let max = Math.max(...bars.map(b=>b.g.right), ...events.map(e=>e.y));
  const span0 = Math.max(max-min, 10), pad = Math.max(2, Math.round(span0*0.03));
  min -= pad; max += pad;
  if(RANGE){   // 画像「見えてる範囲」：その年だけ、そこにいる人だけ
    min=RANGE.min; max=RANGE.max;
    for(let k=bars.length-1;k>=0;k--){ const g=bars[k].g; if(g.right<=min || g.left>=max) bars.splice(k,1); }
  }
  const evShow = RANGE ? events.filter(e=>e.y>=min && e.y<=max) : events;
  geo = {min,max,V};
  const P = y => ((y-min)/(max-min)*100).toFixed(3)+'%';
  const S = (a,b) => ((b-a)/(max-min)*100).toFixed(3)+'%';

  // 縦の長さ（px）
  const span = max-min;
  const narrow = window.innerWidth<=640;
  const NW = Math.round((UI.names ? (narrow?96:150) : 24) * (SET.fs||1));                      // 名前の列の幅
  const baseLen = V ? Math.round(Math.max(480, Math.min(span*7, 2600))) : Math.max(200, chart.clientWidth - NW - 10);
  ZOOM = Math.max(1, Math.min(ZMAX, span/3, ZOOM));   // いちばん拡大しても3年ぶんは見える
  const LEN = Math.round(baseLen * ZOOM);                           // 時間の軸の長さ（px）
  const VH = LEN;
  const step = niceStep(span, Math.max(6, Math.round(LEN/(V?70:110))));
  $('#zbar').hidden=false;
  const ticks=[]; for(let t=Math.ceil(min/step)*step; t<=max; t+=step) ticks.push(t);

  // 重なり
  let ovlR=null, info='';
  if(selected.length===2){
    const [A,B] = selected.map(id=>PEOPLE[id]);
    if(A && B){
      const s=Math.max(midB(A),midB(B)), e=Math.min(endOf(A).y,endOf(B).y);
      const ka=[A,B].some(p=>lifeFuzzy(p)||endOf(p).kind==='unknown')?'頃':'';
      const word=[A,B].some(isPeriod)?'重なってた期間':'同時に生きてた期間';
      if(e>s){ ovlR=[s,e]; info=`<b>${esc(A.n)}</b> と <b>${esc(B.n)}</b> が${word}：${fmtY(s)}${ka}〜${fmtY(e)}${ka}（約${e-s}年）`; }
      else info=`<b>${esc(A.n)}</b> と <b>${esc(B.n)}</b> は重なってない（すき間 約${s-e}年）`;
    }
  } else info = ps.length>=2 ? '帯をクリックで2つ選ぶと重なってた期間 ／ なぞるとその年に何歳か ／ ⋮⋮をつまむと並べ替え ／ ＋−・ctrl＋ほいーる・2本指で拡大' : '';
  $('#info').innerHTML = info;

  const eraList = ERAS[$('#era').value].map(([nm,a,b])=>[nm,Math.max(a,min),Math.min(b,max)]).filter(x=>x[2]>x[1]);
  const useJP = SET.gmode==='jp'||SET.gmode==='both', useCN = SET.gmode==='cn'||SET.gmode==='both';
  const bands = [];
  if(SET.gband && useJP){ const g=gengoSegs(min,max); if(g.length) bands.push({k:'jp', segs:g}); }
  if(SET.gband && useCN){ const g=cnSegs(min,max); if(g.length) bands.push({k:'cn', segs:g}); }
  const gsegs = bands.flatMap(b=>b.segs);
  const tickG = t => { if(!SET.gtick) return []; const a=[]; if(useJP){ const g=gengoTick(t); if(g) a.push(g); } if(useCN){ const g=cnTick(t); if(g) a.push(g); } return a; };
  const showGT = SET.gtick && ticks.some(t=>tickG(t).length);
  const gtLines = SET.gmode==='both' ? 2 : 1;

  const pos = V ? (y=>`top:${P(y)}`) : (y=>`left:${P(y)}`);
  const box = V ? ((a,b)=>`top:${P(a)};height:${S(a,b)}`) : ((a,b)=>`left:${P(a)};width:${S(a,b)}`);

  // 背景
  let bg='';
  eraList.forEach(([nm,a,b],k)=>{ bg += `<div class="era" style="${box(a,b)};background:${k%2?'var(--era2)':'var(--era1)'}"></div>`; });
  ticks.forEach(t=>{ bg += `<div class="gridl" style="${pos(t)}"></div>`; });
  if(ovlR) bg += `<div class="ovl" style="${box(ovlR[0],ovlR[1])}"></div>`;
  evShow.forEach(ev=>{ bg += `<div class="evl" style="${pos(ev.y)}"></div>`; });
  bg += `<div class="cline" id="cline"></div>`;

  // 軸の中身
  const eraLbl = !SET.eralbl ? '' : eraList.map(([nm,a,b])=>`<div class="seglb" style="${box(a,b)}">${esc(nm)}</div>`).join('');
  let gk=0;
  const segHTML = (g, extra) => { const nm=(g.d?g.d+' ':'')+g.n+`（${fmtY(g.rs)}〜${fmtY(g.re)}）`;
    return `<div class="gseg ${g.lane==='all'?'':g.lane} ${(gk++)%2?'alt':''}" style="${extra||''}${box(g.s,g.e)}" data-pop="${esc(nm)}">${esc(g.n)}</div>`; };
  const genRows = bands.map(b=>`<div class="arow gen">${b.segs.map(g=>segHTML(g)).join('')}</div>`).join('');
  const tickLbl = ticks.map(t=>{ const gt=tickG(t); return `<div class="tick" style="${pos(t)}">${fmtY(t)}${gt.map(x=>`<small>${esc(x)}</small>`).join('')}</div>`; }).join('');
  const evLbl = evShow.map(ev=>`<div class="evlb" data-eid="${ev.id}" style="${pos(ev.y)}" title="押すと「消す」が出る">${esc(fmtY(ev.y))} ${esc(ev.n)}</div>`).join('');

  const handle = p => `<span class="grip">⋮⋮</span><button class="x" title="消す" data-rm="${p.id}">×</button>`;
  const barHTML = (p,g) => `<div class="${g.cls}" data-sel="${p.id}" style="${box(g.left,g.right)};background:linear-gradient(${V?'180deg':'90deg'}, ${g.st.join(', ')})" title="${esc(p.n)} ${esc(g.txt)}${g.note?'&#10;'+esc(g.note):''}"><span class="lb" style="${V?'top':'left'}:${g.lbAt}"><b>${esc(p.n)}</b>${esc(g.txt)}</span></div>
      <span class="lbo"><b>${esc(p.n)}</b><span>${esc(g.txt)}</span></span>
      <span class="age" data-b="${g.ageB}" data-s="${g.left}" data-e="${g.right}" data-f="${g.ageF}" data-ua="${g.ua}"></span>`;

  if(!V){
    const rows = bars.map(({p,g})=>`<div class="row${selected.includes(p.id)?' sel':''}" data-id="${p.id}">
      <div class="name dh" data-id="${p.id}">${handle(p)}<span class="nm" title="${esc(p.n)}${p.desc?' — '+esc(p.desc):''}">${esc(p.n)}</span>${isPeriod(p)?'<span class="tag">期間</span>':''}</div>
      <div class="track">${barHTML(p,g)}</div></div>`).join('');
    chart.style.setProperty('--namew', NW+'px');
    chart.innerHTML = `<div class="hscroll"><div class="hinner" style="width:${NW+LEN+10}px">
      <div class="axis"><div class="namecol"></div><div class="atrack" id="atrack">
        ${SET.eralbl?`<div class="arow era">${eraLbl}</div>`:''}
        ${genRows}
        ${evShow.length?`<div class="arow ev">${evLbl}</div>`:''}
        <div class="arow tk${showGT?(gtLines===2?' g3':' g2'):''}" id="tkrow">${tickLbl}<div class="cyear" id="cyear"></div></div>
      </div></div>
      <div class="body" id="cbody"><div class="bg">${bg}</div>${rows}</div></div></div>`;
  } else {
    const FS = SET.fs||1;
    const EX = SET.eralbl ? Math.round(18*FS) : 0, BW = Math.round(20*FS);
    const AX = EX + bands.length*BW + Math.round((showGT?70:46)*FS); AX_=AX;
    const maxLen = Math.max(4, ...bars.map(({p})=>[...p.n].length));
    const HEAD = UI.names ? Math.round(Math.min(360*FS, Math.max(90, (maxLen*13.6 + 46 + (bars.some(({p})=>isPeriod(p))?16:0))*FS))) : Math.round(26*FS); HEAD_=HEAD;
    const genV = bands.map((b,bi)=>b.segs.map(g=>segHTML(g, `left:${EX+bi*BW+(g.lane==='s'?Math.round(9*FS):0)}px;`)).join('')).join('');
    const heads = bars.map(({p})=>`<div class="vhead dh${selected.includes(p.id)?' sel':''}" data-id="${p.id}" title="${esc(p.n)}${p.desc?' — '+esc(p.desc):''}">${handle(p)}<span class="nm">${esc(p.n)}</span>${isPeriod(p)?'<span class="tag">期</span>':''}</div>`).join('');
    const cols = bars.map(({p,g})=>`<div class="col${selected.includes(p.id)?' sel':''}" data-id="${p.id}">${barHTML(p,g)}</div>`).join('');
    const n = Math.max(bars.length,1);
    chart.innerHTML = `<div class="vscroll"><div class="vgrid" style="grid-template-columns:${AX}px repeat(${n}, var(--colw)) minmax(40px,1fr);grid-template-rows:${HEAD}px ${VH}px">
      <div class="corner" style="grid-column:1;grid-row:1"></div>
      ${heads}
      <div class="vhfill" style="grid-column:${n+2} / -1;grid-row:1"></div>
      <div class="vaxis" style="grid-column:1;grid-row:2;position:sticky">
        <div style="position:absolute;inset:0">${eraLbl}${genV}${tickLbl}</div>
      </div>
      <div class="cyear" id="cyear"></div>
      <div class="vbody" id="vbody" style="grid-column:2 / -1;grid-row:2"><div class="bg">${bg}${evLbl}</div><div class="cols">${cols}</div></div>
    </div></div>`;
    // 見出しを1列ずつ並べる
    chart.querySelectorAll('.vhead').forEach((h,i)=>{ h.style.gridColumn=String(i+2); h.style.gridRow='1'; });
  }
  geo.len=LEN; geo.NW = V ? AX_ : NW; geo.HEAD = V ? HEAD_ : 0; if(V) geo.AX=AX_;
  fitLabels(); fitSegs();
  const sc=chart.querySelector(V?'.vscroll':'.hscroll');
  if(sc){
    sc.addEventListener('scroll', onScroll, {passive:true});
    if(anchor){ const vis = V ? sc.clientHeight-HEAD_ : sc.clientWidth-NW;
      const pos = (anchor.y-min)/(max-min)*LEN - anchor.f*vis;
      if(V) sc.scrollTop=Math.max(0,pos); else sc.scrollLeft=Math.max(0,pos); }
  }
  drawMini(bars, min, max); onScroll(); syncURLSoon();
}

function onScroll(){
  hideCursor(); hidePop && hidePop();
  const v=viewInfo(); if(!v) return;
  // 全体図の枠
  const w=$('#mwin'); const a=Math.max(0,v.pos/v.len), b=Math.min(1,(v.pos+v.vis)/v.len);
  w.style.left=(a*100)+'%'; w.style.width=(Math.max(.01,b-a)*100)+'%';
  $('#mlabL').textContent=fmtY(Math.round(geo.min+a*v.span)); $('#mlabR').textContent=fmtY(Math.round(geo.min+b*v.span));
  // 帯の始まりが見えないときは、名前を見えてるはしに寄せる
  const V=geo.V;
  document.querySelectorAll(V?'#chart .col .bar':'#chart .row .bar').forEach(bar=>{
    const lb=bar.querySelector('.lb'); if(!lb || lb.style.visibility==='hidden') return;
    if(lb.dataset.at===undefined) lb.dataset.at = V ? lb.style.top : lb.style.left;
    const start = V ? bar.offsetTop : bar.offsetLeft, size = V ? bar.offsetHeight : bar.offsetWidth;
    const lbSize = V ? lb.scrollHeight : lb.scrollWidth;
    const want = Math.min(v.pos-start+4, size-lbSize-2);   // 見えてるはしへ。帯の終わりより先には行かない
    if(start < v.pos && want > 0){ const px=want+'px'; if(V) lb.style.top=px; else lb.style.left=px; }
    else { if(V) lb.style.top=lb.dataset.at; else lb.style.left=lb.dataset.at; }
  });
}
// 全体図：一人ずつ細い線で
function drawMini(bars, min, max){
  const n=bars.length||1, H=24;
  $('#mlines').innerHTML = bars.map(({p,g},i)=>`<i style="left:${((g.left-min)/(max-min)*100).toFixed(2)}%;width:${(Math.max(.4,(g.right-g.left)/(max-min)*100)).toFixed(2)}%;top:${(n<=1?H/2:i*(H-2)/(n-1)).toFixed(1)}px;background:hsl(${colorH(p.id)} var(--bs) var(--bl))"></i>`).join('');
}
/* ---------- ズーム ---------- */
function zoomTo(z, y, f){
  const v=viewInfo(); if(!v) return;
  if(y==null){ y=v.center; f=.5; }
  ZOOM=Math.max(1, Math.min(ZMAX, z)); pendingAnchor={y, f}; scheduleRender();
}
let rafId=0; function scheduleRender(){ if(rafId) return; rafId=requestAnimationFrame(()=>{ rafId=0; render(); }); }
$('#zIn').addEventListener('click', ()=>zoomTo(ZOOM*1.6));
$('#zOut').addEventListener('click', ()=>zoomTo(ZOOM/1.6));
$('#zAll').addEventListener('click', ()=>zoomTo(1));
$('#namesBtn').addEventListener('click', ()=>{ UI.names=!UI.names; lsSet(UI_KEY, UI); render(); });
// 画面の点 → 年と、見えてる中の位置
function pointYear(cx, cy){
  const v=viewInfo(); if(!v) return null;
  const r=v.sc.getBoundingClientRect();
  const off = geo.V ? cy - r.top - geo.HEAD : cx - r.left - geo.NW;
  const f = Math.max(0, Math.min(1, off/v.vis));
  return {y: geo.min + (v.pos + f*v.vis)/v.len*v.span, f};
}
// ctrl＋ほいーる（Macのとらっくぱっどのぴんちもこれ）
$('#chart').addEventListener('wheel', ev=>{
  if(!ev.ctrlKey || !geo) return;
  ev.preventDefault();
  const a=pointYear(ev.clientX, ev.clientY); if(!a) return;
  zoomTo(ZOOM*Math.exp(-ev.deltaY*0.004), a.y, a.f);
}, {passive:false});
// 2本指ぴんち
const touches=new Map(); let pinch=null;
$('#chart').addEventListener('pointerdown', ev=>{ if(ev.pointerType!=='touch') return; touches.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
  if(touches.size===2){ const [p1,p2]=[...touches.values()]; const a=pointYear((p1.x+p2.x)/2,(p1.y+p2.y)/2);
    pinch={d:geo&&geo.V?Math.abs(p1.y-p2.y):Math.abs(p1.x-p2.x), z:ZOOM, a}; } });
$('#chart').addEventListener('pointermove', ev=>{ if(!touches.has(ev.pointerId)) return; touches.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
  if(pinch && touches.size===2 && pinch.a){ const [p1,p2]=[...touches.values()]; const d=geo.V?Math.abs(p1.y-p2.y):Math.abs(p1.x-p2.x);
    if(pinch.d>20 && d>20) zoomTo(pinch.z*d/pinch.d, pinch.a.y, pinch.a.f); } });
['pointerup','pointercancel'].forEach(t=>$('#chart').addEventListener(t, ev=>{ touches.delete(ev.pointerId); if(touches.size<2) pinch=null; }));
// 全体図の操作
(function(){
  const mini=$('#mini'); let md=null;
  mini.addEventListener('pointerdown', ev=>{
    const v=viewInfo(); if(!v) return; ev.preventDefault();
    const r=mini.getBoundingClientRect(); const fx=(ev.clientX-r.left)/r.width;
    const h=ev.target.closest('.mh');
    if(h) md={mode:h.classList.contains('l')?'l':'r', r, a:v.pos/v.len, b:(v.pos+v.vis)/v.len, z:ZOOM};
    else if(ev.target.closest('.mwin')) md={mode:'move', r, x0:ev.clientX, pos0:v.pos, len:v.len};
    else { const pos=fx*v.len - v.vis/2; if(geo.V) v.sc.scrollTop=pos; else v.sc.scrollLeft=pos; md={mode:'move', r, x0:ev.clientX, pos0:pos, len:v.len}; }
    try{ mini.setPointerCapture(ev.pointerId); }catch(e){}
  });
  mini.addEventListener('pointermove', ev=>{
    if(!md) return; const v=viewInfo(); if(!v) return;
    const fx=Math.max(0,Math.min(1,(ev.clientX-md.r.left)/md.r.width));
    if(md.mode==='move'){ const pos=md.pos0 + (ev.clientX-md.x0)/md.r.width*md.len; if(geo.V) v.sc.scrollTop=pos; else v.sc.scrollLeft=pos; return; }
    // はしを引っぱる：反対側のはしは動かさない
    let a=md.a, b=md.b; if(md.mode==='l') a=Math.min(fx, b-0.005); else b=Math.max(fx, a+0.005);
    const z = md.z * (md.b-md.a)/(b-a);
    zoomTo(z, geo.min+(md.mode==='l'?b:a)*v.span, md.mode==='l'?1:0);
  });
  ['pointerup','pointercancel'].forEach(t=>mini.addEventListener(t, ()=>{ md=null; }));
})();

// 帯に入りきらない名前は外へ（横：右→左、縦：下→上）
function fitLabels(){
  const V = SET.orient==='v';
  document.querySelectorAll(V?'#chart .col':'#chart .row').forEach(row=>{
    const bar=row.querySelector('.bar'), lb=bar&&bar.querySelector('.lb'), lbo=row.querySelector('.lbo');
    const tr = V ? row : row.querySelector('.track');
    if(!bar||!lb||!lbo) return;
    lb.style.visibility=''; lbo.style.display='none';
    const outside = SET.lpos!=='in';
    const fits = V ? (lb.offsetTop + lb.scrollHeight <= bar.clientHeight + 1) : (lb.offsetLeft + lb.scrollWidth <= bar.clientWidth + 1);
    if(fits && !outside) return;
    lbo.style.display='flex';
    // うしろ（横：右、縦：下）とまえ（横：左、縦：上）。入らない側なら反対へ
    const size = V ? lbo.offsetHeight : lbo.offsetWidth;
    const st = V ? bar.offsetTop : bar.offsetLeft, len = V ? bar.offsetHeight : bar.offsetWidth;
    const room = V ? tr.clientHeight : tr.clientWidth;
    const after = st+len+5, before = st-size-5;
    const okA = after+size <= room, okB = before >= 0;
    let at = null;
    if(SET.lpos==='before') at = okB ? before : okA ? after : null;
    else at = okA ? after : okB ? before : null;
    if(at==null){ lbo.style.display='none'; return; }     // どっちにも入らないときは帯の中のまま
    if(V) lbo.style.top=at+'px'; else lbo.style.left=at+'px';
    lb.style.visibility='hidden';
  });
}
// 時代・元号の名前、入らないものは隠す
function fitSegs(){
  const V = SET.orient==='v';
  document.querySelectorAll('#chart .seglb').forEach(el=>{
    el.style.color='';
    const over = V ? el.scrollHeight > el.clientHeight+1 : el.scrollWidth > el.clientWidth+1;
    if(over) el.style.color='transparent';
  });
  // できごとの名前が重なったら段をずらす
  const evs=[...document.querySelectorAll('#chart .evlb')];
  if(evs.length){
    const ends=[]; const key = V ? 'top' : 'left';
    evs.map(el=>{ const r=el.getBoundingClientRect(); return {el, a:V?r.top:r.left, b:V?r.bottom:r.right}; }).sort((x,y)=>x.a-y.a).forEach(o=>{
      let ln=ends.findIndex(e=>e < o.a-4); if(ln<0){ ln=ends.length; ends.push(0); }
      ends[ln]=o.b;
      if(V) o.el.style.left=(2+ln*4)+'px', o.el.style.marginLeft=(ln*0)+'px', o.el.style.transform=`translateY(${-100-ln*100}%)`;
      else o.el.style.top=(1+ln*15)+'px';
    });
    const row=document.querySelector('#chart .arow.ev'); if(row) row.style.height=(16+(ends.length-1)*15)+'px';
  }
  document.querySelectorAll('#chart .gseg').forEach(el=>{
    el.classList.remove('tiny');
    const over = V ? el.scrollHeight > el.clientHeight+1 : el.scrollWidth > el.clientWidth+1;
    if(over) el.classList.add('tiny');
  });
}
window.addEventListener('resize', ()=>{ clearTimeout(fitLabels._t); fitLabels._t=setTimeout(()=>{ fitLabels(); fitSegs(); },120); });

/* ---------- なぞると年齢＋元号 ---------- */
function yearLabel2(y){
  const a=[]; if(SET.glabel){ if(SET.gmode==='jp'||SET.gmode==='both'){ const g=gengoAt(y); if(g) a.push(g); } if(SET.gmode==='cn'||SET.gmode==='both'){ const g=cnAt(y); if(g) a.push(g); } }
  return (y<=0?'紀元前'+(1-y):y)+'年'+(a.length?`（${a.join('｜')}）`:'');
}
function onMove(ev){
  if(!geo || drag || (pan && pan.on)) return;
  const V = geo.V;
  const base = V ? $('#vbody') : $('#tkrow'); if(!base) return;
  const r = base.getBoundingClientRect();
  const f = V ? (ev.clientY - r.top)/r.height : (ev.clientX - r.left)/r.width;
  const cl=$('#cline'), cy=$('#cyear');
  if(f<0||f>1){ hideCursor(); return; }
  const y = Math.round(geo.min + f*(geo.max-geo.min));
  const p = ((y-geo.min)/(geo.max-geo.min)*100)+'%';
  cl.style.display='block'; cy.style.display='block'; cy.textContent = yearLabel2(y);
  if(V){ cl.style.top=p;
    // 札は目盛りの右どなり、線の上（横にすくろーるしても付いてくる）
    const sc=$('#chart .vscroll'); cy.style.left=((sc?sc.scrollLeft:0)+geo.AX+4)+'px'; cy.style.top=(geo.HEAD + f*r.height)+'px';
  } else { cl.style.left=p; cy.style.left=p;
    // 札がはみ出さないように
    const w=cy.offsetWidth, x=f*r.width; cy.style.transform = `translateX(${x-w/2<0?-x: x+w/2>r.width? -(w-(r.width-x)) : -w/2}px)`; }
  document.querySelectorAll('#chart .age').forEach(a=>{
    const b=+a.dataset.b, s0=+a.dataset.s, e=+a.dataset.e;
    if(a.dataset.f==='p' || !(y>=s0 && y<=e && y>=b)){ a.style.display='none'; return; }
    const fz=a.dataset.f==='1' || (a.dataset.ua!=='' && y>+a.dataset.ua);
    a.style.display='block'; if(V) a.style.top=p; else a.style.left=p; a.textContent=(fz?'約':'')+(y-b)+'歳';
  });
}
function hideCursor(){ const cl=$('#cline'), cy=$('#cyear'); if(cl) cl.style.display='none'; if(cy) cy.style.display='none'; document.querySelectorAll('#chart .age').forEach(a=>a.style.display='none'); }
$('#chart').addEventListener('pointermove', onMove);
$('#chart').addEventListener('pointerleave', hideCursor);
document.addEventListener('click', ev=>{ if(!ev.target.closest('.gseg')) hidePop(); });
window.addEventListener('scroll', ()=>hidePop(), {passive:true});

/* ---------- 名前をつまんで並べ替え ---------- */
let drag=null, justDragged=false;
// まうすで掴んでぐいっ（すまほは指でそのまま動くので、まうすだけ）
let pan=null;
$('#chart').addEventListener('pointerdown', ev=>{
  if(ev.pointerType!=='mouse' || ev.button!==0) return;
  if(ev.target.closest('.grip,.gseg,.evlb,button,input,[contenteditable]')) return;
  const sc=ev.target.closest('.hscroll,.vscroll'); if(!sc) return;
  pan={sc, x0:ev.clientX, y0:ev.clientY, l0:sc.scrollLeft, t0:sc.scrollTop, on:false, pid:ev.pointerId};
});
document.addEventListener('pointermove', ev=>{
  if(!pan || ev.pointerId!==pan.pid) return;
  const dx=ev.clientX-pan.x0, dy=ev.clientY-pan.y0;
  if(!pan.on){ if(Math.hypot(dx,dy)<5) return; pan.on=true; document.body.classList.add('panning'); hideCursor(); try{ pan.sc.setPointerCapture(pan.pid); }catch(e){} }
  pan.sc.scrollLeft=pan.l0-dx; pan.sc.scrollTop=pan.t0-dy;
});
function endPan(){ if(!pan) return; if(pan.on){ justDragged=true; setTimeout(()=>justDragged=false,50); document.body.classList.remove('panning'); } pan=null; }
document.addEventListener('pointerup', endPan);
document.addEventListener('pointercancel', endPan);
$('#chart').addEventListener('pointerdown', ev=>{
  const g=ev.target.closest('.grip'); if(!g) return;   // 並べ替えは「⋮⋮」をつまんだときだけ
  const h=g.closest('.dh'); if(!h) return; ev.preventDefault();
  drag={id:h.dataset.id, x0:ev.clientX, y0:ev.clientY, on:false, target:null, after:false, pid:ev.pointerId, h};
});
document.addEventListener('pointermove', ev=>{
  if(!drag) return;
  const V = SET.orient==='v';
  if(!drag.on){
    if(Math.hypot(ev.clientX-drag.x0, ev.clientY-drag.y0) < 6) return;
    drag.on=true; hideCursor();
    try{ drag.h.setPointerCapture(drag.pid); }catch(e){}
    document.querySelectorAll(`#chart [data-id="${CSS.escape(drag.id)}"]`).forEach(el=>el.classList.add('dragging'));
  }
  ev.preventDefault();
  const hs=[...document.querySelectorAll('#chart .dh')];
  const markEls = V ? hs : hs.map(h=>h.closest('.row'));
  markEls.forEach(el=>el.classList.remove('ins-b','ins-a'));
  let tgt=null, after=false;
  for(let i=0;i<hs.length;i++){
    const r=hs[i].getBoundingClientRect(); const mid = V ? r.left+r.width/2 : r.top+r.height/2; const v = V ? ev.clientX : ev.clientY;
    if(v < mid){ tgt=i; after=false; break; }
    tgt=i; after=true;
  }
  if(tgt!=null){ markEls[tgt].classList.add(after?'ins-a':'ins-b'); drag.target=hs[tgt].dataset.id; drag.after=after; }
});
function endDrag(){
  if(!drag) return;
  const d=drag; drag=null;
  if(!d.on) return;
  justDragged=true; setTimeout(()=>justDragged=false,50);
  if(d.target && d.target!==d.id){
    if($('#sort').value!=='added'){ list=sorted().map(p=>p.id); $('#sort').value='added'; }
    list=list.filter(x=>x!==d.id);
    let i=list.indexOf(d.target); if(d.after) i++;
    list.splice(i,0,d.id);
  }
  render(); syncURL();
}
document.addEventListener('pointerup', endDrag);
document.addEventListener('pointercancel', endDrag);

function showEvPop(id, x, y){
  const e=events.find(v=>v.id===id); if(!e) return; const pop=$('#evpop');

// Wikidataで人も期間もできごともまとめて探す
async function searchAll(v){
  const things = await searchThings(v);
  const need = things.filter(x=>x.kind==='person' && !PEOPLE[x.id]).map(x=>x.id);
  const ppl = need.length ? await fetchPeople(need) : {};
  const out=[];
  for(const x of things){
    if(x.kind==='person'){ const p=PEOPLE[x.id]||ppl[x.id]; if(p && p.b!=null){ if(!p.desc && x.desc) p.desc=x.desc; out.push({kind:'person', p, n:p.n}); } }
    else out.push({kind:x.kind, t:x, n:x.n});
  }
  // 名前がぴったり → 人 → 期間・できごと → 年なし
  const rank=r=>(r.n===v?0:10)+({person:0, period:1, event:1, none:5}[r.kind]);
  return out.map((r,i)=>({r,i})).sort((a,b)=>rank(a.r)-rank(b.r)||a.i-b.i).map(o=>o.r);
}
q.addEventListener('input', ()=>{
  const v=q.value.trim(); const seq=++searchSeq;
  if(!v){ showDD([]); return; }
  const loc = localMatch(v).map(p=>({kind:'person', p, n:p.n}));
  showDD(loc, 'Wikidataで探してる…');
  clearTimeout(q._t);
  q._t = setTimeout(async ()=>{
    try{
      const live = await searchAll(v);
      if(seq!==searchSeq) return;
      const seen=new Set(loc.map(r=>r.p.id));
      const merged = loc.concat(live.filter(r=>!(r.kind==='person' && seen.has(r.p.id)))).slice(0,12);
      showDD(merged, merged.length?'':'見つからない…（短くしてみてネ）');

});

/* ---------- 名前をまとめて探す（4人ずつ同時、途中で止められる） ---------- */
let runId=0;
async function resolveMany(names, my, onFound){
  const miss=[]; let next=0, done=0;
  async function worker(){
    while(next<names.length){
      const i=next++; const p=await resolveName(names[i]);
      if(my!==runId) return;
      done++; toast(`さがし中… ${done}/${names.length}`);
      if(p) onFound(p); else miss.push(names[i]);
    }
  }
  await Promise.all(Array.from({length:Math.min(4,names.length)}, worker));
  return {miss, stopped: my!==runId};
}

// 年を見て、できごと（線）か期間（帯）かを自動で決める
function upsertManual(editId, name, a, b, q){
  const isEv = (b==null || b===a);
  if(editId){
    const wasEv=/^E/.test(editId);
    if(wasEv && isEv){ Object.assign(events.find(x=>x.id===editId), {n:name, y:a}); }
    else if(!wasEv && !isEv){ const q=PEOPLE[editId]; ['b2','d2','bm','dm','bl','dl','bv','dv','now','pre','bc','dc'].forEach(k=>delete q[k]); Object.assign(q, {n:name, b:a, d:b}); }
    else {   // 線⇔帯が入れかわる
      const old = wasEv ? events.find(x=>x.id===editId) : PEOPLE[editId]; q = q || (old && old.q);
      const idx = wasEv ? -1 : list.indexOf(editId);
      if(wasEv) events=events.filter(x=>x.id!==editId); else { list=list.filter(x=>x!==editId); delete PEOPLE[editId]; }
      editId=null;
      if(!isEv){ const id='M'+(manSeq++); PEOPLE[id]={id, n:name, type:'period', b:a, d:b, q}; if(idx>=0) list.splice(idx,0,id); else list.push(id); }
      else events.push({id:'E'+(manSeq++), n:name, y:a, q});
    }
  } else {
    if(isEv) events.push({id:'E'+(manSeq++), n:name, y:a, q});
    else { const id='M'+(manSeq++); PEOPLE[id]={id, n:name, type:'period', b:a, d:b, q}; list.push(id); }
  }
  events.sort((x,y)=>x.y-y.y);
  return isEv;
}

/* ---------- Wikidataで出来事・期間を探す ---------- */
function thingsQuery(ids){
  return `SELECT ?p ?jl ?el ?jd ?h ?k ?s ?rank ?t ?prec WHERE {
  VALUES ?p { ${ids.map(x=>'wd:'+x).join(' ')} }
  OPTIONAL { ?p rdfs:label ?jl FILTER(LANG(?jl)="ja") }
  OPTIONAL { ?p rdfs:label ?el FILTER(LANG(?el)="en") }
  OPTIONAL { ?p schema:description ?jd FILTER(LANG(?jd)="ja") }
  OPTIONAL { ?p wdt:P31 wd:Q5 . BIND(1 AS ?h) }
  OPTIONAL {
    VALUES (?k ?pp ?psv) { ("t" p:P585 psv:P585) ("s" p:P580 psv:P580) ("e" p:P582 psv:P582) ("s" p:P571 psv:P571) ("e" p:P576 psv:P576) }
    ?p ?pp ?s . ?s wikibase:rank ?rank . FILTER(?rank != wikibase:DeprecatedRank)
    OPTIONAL { ?s ?psv ?v . ?v wikibase:timeValue ?t ; wikibase:timePrecision ?prec . }
  }
}`;
}
async function searchThings(q){
  const hits=await wdSearch(q); if(!hits.length) return [];
  const rows=await sparql(thingsQuery(hits.map(h=>h.id)));
  const by={};
  for(const r of rows){
    const id=r.p.value.split('/').pop();
    const o=by[id]||(by[id]={id, n:null, en:null, desc:'', h:false, st:{t:new Map(), s:new Map(), e:new Map()}});
    if(r.jl) o.n=r.jl.value; if(r.el) o.en=r.el.value; if(r.jd) o.desc=r.jd.value; if(r.h) o.h=true;
    if(r.k && r.s && o.st[r.k.value]){ const m=o.st[r.k.value]; let x=m.get(r.s.value);
      if(!x){ x={rank:/Preferred/.test(r.rank?r.rank.value:'')?'p':'n', y:null, prec:null, circa:false}; m.set(r.s.value,x); }
      if(r.t){ const y=parseYear(r.t.value); if(y!=null){ x.y=y; x.prec=r.prec?+r.prec.value:null; } } }
  }
  return hits.map(h=>{
    const o=by[h.id]; if(!o) return null;
    const T=summarize([...o.st.t.values()]), S=summarize([...o.st.s.values()]), E=summarize([...o.st.e.values()]);
    const ok=x=>x && !x.unknown;
    let a=null, b=null, open=false;
    if(ok(S)){ a=S.lo; b=ok(E)?E.hi:null; if(b==null){ if(ok(T)) b=T.hi; else open=true; } }
    else if(ok(T)){ a=T.lo; b=T.hi; if(ok(E)) b=E.hi; }
    else if(ok(E)){ a=E.lo; b=E.hi; }
    if(open) b=CUR;        // 終わりがない（今も続いてる国など）は今年まで
    const kind = o.h ? 'person' : a==null ? 'none' : (b==null||b===a) ? 'event' : 'period';
    return {id:h.id, n:o.n||o.en||h.label||h.id, desc:o.desc||h.description||'', a, b, open, kind};
  }).filter(Boolean);
}
async function pickThing(x){
  if(!x) return;
  if(x.kind==='none'){ UI.add=true; applyUI(); $('#manBox').open=true; $('#mName').value=x.n; manMsg(`「${x.n}」は年が登録されてない…ここに年を入れてネ`, true); toast('年が登録されてない…手で入れてネ'); $('#mS').focus(); return; }
  if(x.kind==='person'){
    try{ const got=await fetchPeople([x.id]); const p=got[x.id]; if(p && p.b!=null){ remember(p); add(p); manMsg(`「${p.n}」は人だから、人として足した`); } else manMsg('生年が登録されてない人…',true); }
    catch(e){ manMsg('Wikidataにつながらない…',true); }
    return;
  }
  const ev=upsertManual(null, x.n, x.a, x.kind==='event'?null:x.b, x.id);
  const msg=`「${x.n}」を追加した（${ev?'できごと・線':'期間・帯'}）${x.open?'。終わりが登録されてないから今年まで':''}`; manMsg(msg+'。年は一覧の名前を押せばなおせる'); toast(msg);
  render(); syncURL();
}

function syncTitle(fromH){
  const t = fromH ? $('#titleH').textContent.trim() : $('#title').value.trim();
  if(fromH) $('#title').value=t; else if($('#titleH').textContent!==t) $('#titleH').textContent=t;
  $('#titleH').hidden = !t && document.activeElement!==$('#titleH');
  document.title = t ? `${t}｜生没年グラフ` : '生没年グラフ';
}
$('#titleH').addEventListener('input', ()=>{ syncTitle(true); clearTimeout($('#title')._t); $('#title')._t=setTimeout(syncURL,300); });
$('#titleH').addEventListener('keydown', ev=>{ if(ev.key==='Enter'){ ev.preventDefault(); $('#titleH').blur(); } });
$('#titleH').addEventListener('blur', ()=>syncTitle(true));
$('#title').addEventListener('input', ()=>syncTitle(false));
$('#title').addEventListener('input', ()=>{ clearTimeout($('#title')._t); $('#title')._t=setTimeout(syncURL,300); });
$('#clear').addEventListener('click', ()=>{ runId++; list.filter(id=>/^M/.test(id)).forEach(id=>delete PEOPLE[id]);
  list=[]; events=[]; selected=[]; colorIdx={}; nextColor=0; render(); syncURL(); });
$('#share').addEventListener('click', async ()=>{
  await syncURL();
  try{ await navigator.clipboard.writeText(location.href); toast('URLコピーした！'); }catch(e){ prompt('このURLを共有',location.href); }
});

/* ---------- 画像で保存・コピー ---------- */
let shotLib=null;
function loadShotLib(){
  if(window.htmlToImage) return Promise.resolve();
  if(shotLib) return shotLib;
  shotLib=new Promise((res,rej)=>{ const sc=document.createElement('script');
    sc.src='https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js';
    sc.onload=res; sc.onerror=()=>{ shotLib=null; rej(new Error('画像の道具が読み込めない')); }; document.head.appendChild(sc); });
  return shotLib;
}
const nextFrame=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
async function makeShot(mode){
  if(!geo){ toast('まだ何も並んでない…'); return null; }
  toast('画像を作ってる…');
  await loadShotLib();
  const v=viewInfo(); const keepZ=ZOOM, keepC=v?v.center:null;
  if(mode==='view' && v && ZOOM>1.01) RANGE={min:geo.min + v.pos/v.len*v.span, max:geo.min + Math.min(v.len, v.pos+v.vis)/v.len*v.span};
  ZOOM=1;
  const cap=$('#cap'); cap.classList.add('capturing');
  const t=$('#title').value.trim();
  $('#credit').textContent=`生没年グラフ ｜ データ：Wikidata（CC0）ほか ｜ ${new Date().toLocaleDateString('ja-JP')}`;
  hideCursor(); hidePop(); hideEvPop();
  let blob=null;
  try{
    render(); await nextFrame(); fitLabels(); fitSegs(); onScroll(); hideCursor();
    if(document.fonts && document.fonts.ready) await document.fonts.ready;
    const sc=cap.querySelector('.vscroll,.hscroll');
    const extra = sc ? Math.max(0, sc.scrollWidth - sc.clientWidth) : 0;   // 縦表示で横にはみ出してるぶん
    if(extra) cap.style.width = (cap.offsetWidth + extra + 4)+'px';
    await nextFrame();
    const bg=getComputedStyle(document.body).backgroundColor;
    blob = await htmlToImage.toBlob(cap, {pixelRatio:2, backgroundColor:bg, width:cap.offsetWidth, height:cap.offsetHeight,
      filter:n=>!(n.classList && (n.classList.contains('cyear')||n.classList.contains('cline')||n.classList.contains('age')))});
  } finally {
    cap.classList.remove('capturing'); cap.style.width=''; RANGE=null; ZOOM=keepZ; if(keepC!=null) pendingAnchor={y:keepC, f:.5}; render();
  }
  return blob;
}
function shotName(){ const t=new Date(), ymd=`${t.getFullYear()}${String(t.getMonth()+1).padStart(2,'0')}${String(t.getDate()).padStart(2,'0')}`;
  return (($('#title').value.trim()||'生没年グラフ').replace(/[\\/:*?"<>|]/g,'_'))+'_'+ymd+'.png'; }
async function shotSave(mode){
  try{ const blob=await makeShot(mode); if(!blob) return;
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=shotName(); document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),3000); toast('画像を保存した！'); }
  catch(e){ toast('画像が作れなかった…（'+e.message+'）'); }
}
$('#shotSaveV').addEventListener('click', ()=>shotSave('view'));
$('#shotSaveA').addEventListener('click', ()=>shotSave('all'));
$('#shotCopyV').addEventListener('click', async ()=>{
  try{
    if(!navigator.clipboard || typeof ClipboardItem==='undefined') throw new Error('このぶらうざは画像のコピーができない');
    // Safari向け：くりっくしたその場で ClipboardItem を作って、中身はあとから
    const p=makeShot('view').then(b=>{ if(!b) throw new Error('まだ何も並んでない'); return b; });
    await navigator.clipboard.write([new ClipboardItem({'image/png': p})]);
    toast('画像をコピーした！ そのまま貼りつけられる');
  }catch(e){ toast('コピーできなかった…（'+e.message+'）。「画像で保存」を使ってネ'); }
});

/* ---------- 表示の保存・読み込み ---------- */
function snapshot(){
  const item = id => { const p=PEOPLE[id]; if(!p) return null; if(isPeriod(p)) return {...p}; const o=pickFields(p); if(p.type) o.type=p.type; return o; };
  return {app:'seibotsunen-graph', version:1, saved:new Date().toISOString(),
    title:$('#title').value.trim(), order:list.slice(), items:list.map(item).filter(Boolean), events:events.map(e=>({...e})),
    selected:selected.slice(), settings:{...SET, sort:$('#sort').value, era:$('#era').value}};
}
$('#saveJson').addEventListener('click', ()=>{
  const d=snapshot();
  if(!d.items.length && !d.events.length){ toast('まだ何も並んでない…'); return; }
  const t=new Date(), ymd=`${t.getFullYear()}${String(t.getMonth()+1).padStart(2,'0')}${String(t.getDate()).padStart(2,'0')}`;
  const name=((d.title||'生没年グラフ').replace(/[\\/:*?"<>|]/g,'_'))+'_'+ymd+'.json';
  const blob=new Blob([JSON.stringify(d,null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
});
$('#loadJson').addEventListener('click', ()=>$('#loadFile').click());
$('#loadFile').addEventListener('change', async ev=>{
  const f=ev.target.files[0]; ev.target.value=''; if(!f) return;
  try{
    const d=JSON.parse(await f.text());
    if(d.app!=='seibotsunen-graph') throw 0;
    runId++;
    list.filter(id=>/^M/.test(id)).forEach(id=>delete PEOPLE[id]);
    for(const it of d.items||[]){ if(!it || !it.id) continue; PEOPLE[it.id]={...it}; const m=/^[ME](\d+)$/.exec(it.id); if(m && +m[1]>=manSeq) manSeq=+m[1]+1; }
    events=(d.events||[]).map(e=>({...e})); events.forEach(e=>{ const m=/^E(\d+)$/.exec(e.id); if(m && +m[1]>=manSeq) manSeq=+m[1]+1; });
    list=(d.order||[]).filter(id=>PEOPLE[id]); selected=(d.selected||[]).filter(id=>list.includes(id));
    colorIdx={}; nextColor=0;
    const s=d.settings||{};
    Object.assign(SET, {orient:s.orient||'h', gtick:!!s.gtick, gband:!!s.gband, gmode:s.gmode||'jp', theme:s.theme||SET.theme, glabel:s.glabel!==false, eralbl:s.eralbl!==false, lpos:s.lpos||'in', font:s.font||SET.font, fs:s.fs||1});
    if(s.sort) $('#sort').value=s.sort; if(s.era) $('#era').value=s.era;
    $('#title').value=d.title||''; syncTitle(false);
    applySet(); render(); syncURL(); toast('読み込んだ！');
  }catch(e){ toast('このファイルは読めない…（保存ボタンで作ったファイルを選んでネ）'); }
});

/* ---------- データ読込 ---------- */
function useData(d){
  DATA = d;
  for(const [id,p] of Object.entries(d.people||{})) PEOPLE[id] = {...pickFields({id,...p}), links:p.l??null};
  const n = Object.keys(d.people||{}).length;
  $('#dataStat').textContent = `手元データ ${n}人`;
  drawPresets(); drawCats(); render();
}
$('#dataFile').addEventListener('change', async ev=>{
  const f=ev.target.files[0]; if(!f) return;
  try{ useData(JSON.parse(await f.text())); toast('データ読み込んだ！'); }catch(e){ toast('読めないファイル…'); }
});

(async function init(){
  applySet(); applyUI(); syncManForm(); drawPresets(); drawPPresets(); drawCats();
  try{ const r = await fetch(DATA_URL,{cache:'no-cache'}); if(r.ok) useData(await r.json()); }catch(e){}
  if(!DATA) $('#dataStat').textContent = '手元データなし（Wikidataから直接さがす）';
  const sp = new URL(location.href).searchParams;
  if(sp.get('s') && canZip){
    try{
      const o=JSON.parse(await unzipStr(sp.get('s')));
      const ids=await unpackState(o); applySet();
      if(ids.length){ await ensureIds(ids); ids.forEach(id=>add(PEOPLE[id],true)); }
      selected=(o.s||[]).map(i=>list[i]).filter(Boolean).slice(0,2);
      if(o.z>1 && Number.isFinite(o.c)){ ZOOM=o.z; pendingAnchor={y:o.c, f:.5}; }
      render(); syncTitle(false); READY=true; syncURL(); return;
    }catch(e){ toast('共有URLが読めなかった…'); }
  }
  readManualParam(sp.get('m'));
  if(sp.get('t')) $('#title').value=sp.get('t');
  if(sp.get('sort')==='added') $('#sort').value='added';     // 古い共有URL
  if(sp.get('v')){ readViewCode(sp.get('v')); applySet(); }
  const ids = (sp.get('ids')||'').split(',').filter(x=>/^(Q|M)\d+$/.test(x));
  if(ids.length){ await ensureIds(ids); ids.forEach(id=>add(PEOPLE[id],true)); }
  selected = (sp.get('sel')||'').split(',').filter(id=>list.includes(id)).slice(0,2);
  const z=+sp.get('z'), c=+sp.get('c');
  if(z>1 && Number.isFinite(c) && sp.get('c')!==null){ ZOOM=z; pendingAnchor={y:c, f:.5}; }
  render(); syncTitle(false);
  READY=true; syncURL();
})();
</script>
